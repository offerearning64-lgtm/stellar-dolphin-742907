<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>BRICK BREAKER</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{position:fixed;inset:0;overflow:hidden;background:#0b0d12;font-family:'Chakra Petch',sans-serif;color:#e8e6df;touch-action:none}
  #game{position:fixed;inset:0}
  canvas{display:block;position:absolute;inset:0}
  /* halki CRT scanline texture */
  #game::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;background:rgba(11,13,18,.92);
    border-bottom:1px solid #1c212b}
  .hb{display:flex;flex-direction:column;line-height:1.05;min-width:52px}
  .hb .lbl{font-size:9px;letter-spacing:2px;color:#7b8291;font-weight:600}
  .hb .val{font-family:'Bungee';font-size:16px;color:#e8e6df}
  #hudScore{color:#ffc233}
  #hudScore.pop{animation:pop .18s ease}
  @keyframes pop{50%{transform:scale(1.22)}}
  #hudLives{display:flex;gap:5px;margin-left:auto}
  .life{width:10px;height:10px;border-radius:50%;background:#242a35;border:1px solid #333b47}
  .life.on{background:#ff3d6e;border-color:#ff7a9c}
  .icoBtn{width:38px;height:38px;border-radius:9px;border:1px solid #2a303c;background:#12151d;color:#aeb6c4;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .icoBtn:active{transform:scale(.92);color:#ffc233}
  .icoBtn svg{width:18px;height:18px}

  /* ---------- tap hint ---------- */
  #tapHint{position:absolute;left:0;right:0;text-align:center;z-index:8;pointer-events:none;
    font-family:'Bungee';font-size:13px;letter-spacing:2px;color:#ffc233;opacity:0;transition:opacity .25s}
  #tapHint.show{opacity:1;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.35}}

  /* ---------- overlays ---------- */
  .overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(8,10,14,.84);opacity:0;pointer-events:none;transition:opacity .25s}
  .overlay.show{opacity:1;pointer-events:auto}
  .panel{background:#10131a;border:1px solid #262c38;border-radius:16px;padding:30px 26px 26px;
    width:min(340px,86vw);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .title{font-family:'Bungee';font-size:38px;line-height:1.02;color:#e8e6df}
  .title em{font-style:normal;color:#ffc233;display:block}
  .sub{margin-top:10px;font-size:12px;letter-spacing:3px;color:#7b8291;font-weight:600}
  .bigScore{font-family:'Bungee';font-size:44px;color:#ffc233;margin:14px 0 2px}
  .row{display:flex;justify-content:space-between;font-size:13px;color:#aeb6c4;padding:7px 2px;border-bottom:1px dashed #232936}
  .row b{color:#e8e6df}
  .btn{display:block;width:100%;margin-top:12px;font-family:'Bungee';font-size:14px;letter-spacing:1px;
    background:#ffc233;color:#171203;border:0;border-radius:10px;padding:14px;cursor:pointer;
    box-shadow:0 4px 0 #b8860f}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8860f}
  .btn.ghost{background:transparent;color:#aeb6c4;border:1px solid #333a47;box-shadow:0 4px 0 #1a1f29}
  .btn.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 #1a1f29}
  .badge{display:inline-block;margin-top:8px;background:#ff3d6e;color:#fff;font-family:'Bungee';font-size:11px;
    letter-spacing:2px;padding:5px 12px;border-radius:99px}
  .hint{margin-top:14px;font-size:11px;color:#5c6373;letter-spacing:1px}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div id="hud" class="ui">
    <div class="hb"><span class="lbl">SCORE</span><span class="val" id="hudScore">0</span></div>
    <div class="hb"><span class="lbl">LEVEL</span><span class="val" id="hudLevel">1/8</span></div>
    <div class="hb"><span class="lbl">BEST</span><span class="val" id="hudBest">0</span></div>
    <div id="hudLives"></div>
    <button class="icoBtn" id="btnSound" aria-label="sound">
      <svg id="icoSndOn" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg id="icoSndOff" viewBox="0 0 24 24" fill="none" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="icoBtn" id="btnPause" aria-label="pause">
      <svg viewBox="0 0 24 24" fill="none"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="tapHint">TAP TO LAUNCH</div>

  <!-- MENU -->
  <div class="overlay show" id="ovMenu">
    <div class="panel">
      <div class="title"><em>BRICK</em>BREAKER</div>
      <div class="sub">ARCADE EDITION</div>
      <div class="row" style="margin-top:16px"><span>BEST SCORE</span><b id="menuBest">0</b></div>
      <div class="row"><span>PROGRESS</span><b id="menuProg">LEVEL 1</b></div>
      <button class="btn" id="btnPlay">START GAME</button>
      <button class="btn ghost" id="btnContinue" style="display:none">CONTINUE</button>
      <div class="hint">DRAG &middot; MOVE &nbsp;&nbsp; TAP &middot; LAUNCH</div>
    </div>
  </div>

  <!-- LEVEL CLEAR -->
  <div class="overlay" id="ovClear">
    <div class="panel">
      <div class="title" style="font-size:26px" id="clearTitle">LEVEL 1 CLEAR!</div>
      <div class="row" style="margin-top:14px"><span>LEVEL SCORE</span><b id="cLvl">0</b></div>
      <div class="row"><span>LIFE BONUS</span><b id="cBonus">0</b></div>
      <div class="row"><span>TOTAL SCORE</span><b id="cTotal">0</b></div>
      <button class="btn" id="btnNext">NEXT LEVEL</button>
      <button class="btn ghost" id="btnClearMenu">MAIN MENU</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay" id="ovOver">
    <div class="panel">
      <div class="title" style="font-size:28px;color:#ff3d6e">GAME OVER</div>
      <div class="bigScore" id="ovScore">0</div>
      <div class="sub">SCORE</div>
      <div class="badge" id="ovNewBest" style="display:none">NEW BEST!</div>
      <div class="row" style="margin-top:14px"><span>BEST SCORE</span><b id="ovBest">0</b></div>
      <button class="btn" id="btnRetry">RETRY</button>
      <button class="btn ghost" id="btnOverMenu">MAIN MENU</button>
    </div>
  </div>

  <!-- WIN -->
  <div class="overlay" id="ovWin">
    <div class="panel">
      <div class="title" style="color:#38d97f">YOU WIN!</div>
      <div class="sub">ALL LEVELS CLEARED</div>
      <div class="bigScore" id="winScore">0</div>
      <button class="btn" id="btnAgain">PLAY AGAIN</button>
      <button class="btn ghost" id="btnWinMenu">MAIN MENU</button>
    </div>
  </div>

  <!-- PAUSE -->
  <div class="overlay" id="ovPause">
    <div class="panel">
      <div class="title" style="font-size:26px">PAUSED</div>
      <button class="btn" id="btnResume">RESUME</button>
      <button class="btn ghost" id="btnRestart">RESTART</button>
      <button class="btn ghost" id="btnPauseMenu">MAIN MENU</button>
    </div>
  </div>
</div>

<script>
(()=>{'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const hash=n=>{const s=Math.sin(n)*43758.5453;return s-Math.floor(s);};
const TAU=Math.PI*2;
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=0,H=0;
const HUD_H=64;

/* ================= save ================= */
let save={best:0,maxLevel:1,muted:false};
try{const s=JSON.parse(localStorage.getItem('bb_save_v1'));if(s)save={...save,...s};}catch(e){}
const persist=()=>{try{localStorage.setItem('bb_save_v1',JSON.stringify(save));}catch(e){}};
let muted=!!save.muted;

/* ================= audio (Web Audio, koi file nahi) ================= */
let actx=null;
function audio(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();}
function tone(f,dur=.08,type='square',vol=.14,slide=0){
  if(muted||!actx)return;const t=actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02);}
function boomNoise(dur=.3,vol=.28){
  if(muted||!actx)return;const t=actx.currentTime,n=actx.sampleRate*dur|0;
  const buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=actx.createBufferSource();src.buffer=buf;
  const g=actx.createGain();g.gain.value=vol;
  const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=850;
  src.connect(f).connect(g).connect(actx.destination);src.start(t);}
let lastWall=0;
const SFX={
  paddle:()=>tone(175,.06,'square',.12),
  wall:()=>{const n=performance.now();if(n-lastWall>60){lastWall=n;tone(135,.05,'square',.07);}},
  brick:c=>tone(300+Math.min(c,12)*42,.07,'square',.13),
  metal:()=>tone(560,.05,'triangle',.1,-260),
  boom:()=>{boomNoise();tone(85,.22,'sawtooth',.2,-45);},
  power:()=>{tone(440,.07,'square',.11);setTimeout(()=>tone(660,.09,'square',.11),70);},
  life:()=>tone(320,.2,'sawtooth',.15,-190),
  launch:()=>tone(230,.08,'square',.11,130),
  clear:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.12),i*90)),
  over:()=>[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.2,'sawtooth',.12),i*140)),
};

/* ================= level data ================= */
const TYPES={
 '1':{hp:1,score:50, c:'#ff6b4a',hi:'#ff9d82',lo:'#b8432c'},
 '2':{hp:2,score:90, c:'#ffb830',hi:'#ffd97e',lo:'#b57e0e'},
 '3':{hp:3,score:140,c:'#38d97f',hi:'#8bf0b8',lo:'#1b9152'},
 'E':{hp:1,score:160,c:'#ff3d6e',hi:'#ff8aa8',lo:'#b01c44',explosive:true},
 'X':{hp:Infinity,score:0,c:'#525d6e',hi:'#7e8a9c',lo:'#313844',solid:true},
};
const LEVELS=[
 {name:'FIRST CONTACT',map:['.11111111.','1112211211','1112211211','.11111111.']},
 {name:'THE VAULT',    map:['X11111111X','1122222211','1123EE3211','1122222211','X11111111X']},
 {name:'CROSSFIRE',    map:['22......22','2211111122','.2E2222E2.','2211111122','22......22']},
 {name:'STRIPES',      map:['1.2.3.2.1.','1.2.E.2.1.','1.2.3.2.1.','1.2.E.2.1.','1.2.3.2.1.']},
 {name:'FORTRESS',     map:['3333333333','X22222222X','X1E1111E1X','X22222222X','.33333333.']},
 {name:'CHESSBOARD',   map:['2X2X2X2X2X','1E1E1E1E1E','X2X2X2X2X2','1E1E1E1E1E','2X2X2X2X2X']},
 {name:'PINWHEEL',     map:['....33....','..332233..','.322EE223.','.322EE223.','..332233..','....33....']},
 {name:'FINAL GAUNTLET',map:['E2E2E2E2E2','3333333333','X11111111X','X3EE33EE3X','2222222222']},
];
const PDEF={
 M:{c:'#38d97f',label:'M',name:'MULTI BALL'},
 W:{c:'#ffc233',label:'W',name:'WIDE PADDLE'},
 S:{c:'#6fd3e8',label:'S',name:'SLOW BALL'},
};

/* ================= state ================= */
const S={state:'menu',level:0,score:0,lives:3,combo:0};
let bricks=[],gridMap=[],balls=[],powerups=[],particles=[],floats=[],queue=[];
let paddle={x:0,y:0,w:0,tw:0,h:12,squash:0};
const grid={cols:10,rows:0,x:0,y:0,bw:0,bh:0,pitchX:0,pitchY:0};
let targetX=0,shake=0,flashT=0,introT=0;
let speedBase=0,speedCur=0,slowT=0,wideT=0,bestAtStart=0,lvlScoreStart=0;

const basePW=()=>clamp(W*.22,70,150);
const ballR=()=>clamp(Math.min(W,H)*.012,5,9);

/* ================= layout ================= */
function layout(){
  const DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  paddle.h=Math.max(10,Math.round(H*.02));
  if(wideT<=0)paddle.w=paddle.tw=basePW();else paddle.tw=clamp(W*.34,110,220);
  paddle.y=H-Math.max(64,H*.085);
  paddle.x=clamp(paddle.x||W/2,paddle.w/2,W-paddle.w/2);
  targetX=clamp(targetX||W/2,paddle.w/2,W-paddle.w/2);
  $('#tapHint').style.top=(paddle.y-64)+'px';
  computeGrid();
}
function computeGrid(){
  if(!LEVELS[S.level])return;
  grid.cols=LEVELS[S.level].map[0].length;
  grid.rows=LEVELS[S.level].map.length;
  const pad=Math.max(4,Math.round(W*.012));
  const bw=Math.min((W-pad*(grid.cols+1))/grid.cols,62);
  const bh=clamp(bw*.5,16,H*.052);
  grid.bw=bw;grid.bh=bh;
  grid.pitchX=bw+pad;grid.pitchY=bh+Math.round(pad*.8);
  grid.x=(W-(grid.cols*bw+(grid.cols+1)*pad))/2+pad;
  grid.y=HUD_H+22;
  for(const b of bricks){b.x=grid.x+b.c*grid.pitchX;b.y=grid.y+b.r*grid.pitchY;}
}

/* ================= level setup ================= */
function loadLevel(i){
  S.level=i;
  bricks=[];powerups=[];particles=[];floats=[];queue=[];
  const L=LEVELS[i];
  gridMap=L.map.map(row=>[...row].map(ch=>null));
  L.map.forEach((row,r)=>{[...row].forEach((ch,c)=>{
    if(TYPES[ch]){const b={r,c,ch,hp:TYPES[ch].hp,dead:false,seed:Math.random()*100,x:0,y:0};
      bricks.push(b);gridMap[r][c]=b;}
  });});
  computeGrid();
  speedBase=H*(.5+i*.045);
  speedCur=speedBase;
  slowT=0;wideT=0;paddle.tw=basePW();paddle.w=basePW();
  spawnAttachedBall();
}
function spawnAttachedBall(){
  balls=[{x:paddle.x,y:paddle.y-ballR()-2,vx:0,vy:0,r:ballR(),attached:true,trail:[]}];
}
function launchBalls(){
  let did=false;
  for(const b of balls)if(b.attached){
    b.attached=false;
    const a=-Math.PI/2+rand(-.3,.3);
    b.vx=Math.cos(a)*speedCur;b.vy=Math.sin(a)*speedCur;did=true;
  }
  if(did)SFX.launch();
}

/* ================= bricks ================= */
function cellAt(x,y){return{r:Math.floor((y-grid.y)/grid.pitchY),c:Math.floor((x-grid.x)/grid.pitchX)};}
function hitBricks(b){
  const{r,c}=cellAt(b.x,b.y);
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    const rr=r+dr,cc=c+dc;
    if(rr<0||cc<0||rr>=grid.rows||cc>=grid.cols)continue;
    const br=gridMap[rr][cc];
    if(!br||br.dead)continue;
    const nx=clamp(b.x,br.x,br.x+grid.bw),ny=clamp(b.y,br.y,br.y+grid.bh);
    const dx=b.x-nx,dy=b.y-ny;
    if(dx*dx+dy*dy<=b.r*b.r){resolveBrick(b,br,dx,dy);return;}
  }
}
function resolveBrick(b,br,dx,dy){
  const T=TYPES[br.ch];
  if(dx!==0&&dy!==0){ // corner hit
    const l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l;
    const dot=b.vx*ux+b.vy*uy;
    if(dot<0){b.vx-=2*dot*ux;b.vy-=2*dot*uy;}
  }else if(dx!==0){b.vx=Math.sign(dx)*Math.abs(b.vx);b.x+=Math.sign(dx);}
  else{b.vy=Math.sign(dy)*Math.abs(b.vy);b.y+=Math.sign(dy);}
  if(T.solid){SFX.metal();return;}
  br.hp--;
  if(br.hp<=0)destroyBrick(br,true);
  else{
    SFX.brick(S.combo);
    const cx=br.x+grid.bw/2,cy=br.y+grid.bh/2;
    spawnShatter(cx,cy,T,6,.6);
    shake=Math.min(shake+1.5,12);
  }
}
function destroyBrick(br,direct){
  if(br.dead)return;br.dead=true;gridMap[br.r][br.c]=null;
  const T=TYPES[br.ch];
  const cx=br.x+grid.bw/2,cy=br.y+grid.bh/2;
  S.combo++;
  const pts=Math.round(T.score*(1+(S.combo-1)*.1));
  S.score+=pts;
  if(S.score>save.best)save.best=S.score;
  floats.push({x:cx,y:cy,text:'+'+pts,life:.8,max:.8,size:13,color:'#e8e6df'});
  if(S.combo>=4&&S.combo%4===0)
    floats.push({x:cx,y:cy-20,text:'COMBO x'+S.combo,life:1,max:1,size:17,color:'#ffc233'});
  spawnShatter(cx,cy,T,T.explosive?26:14,1);
  if(T.explosive){
    SFX.boom();shake=Math.min(shake+8,16);
    particles.push({shape:'ring',x:cx,y:cy,r:6,vr:520,life:.35,max:.35,color:'#ff8aa8'});
    if(direct)queueExplosion(br.r,br.c,.08);
  }else{
    SFX.brick(S.combo);
    shake=Math.min(shake+2.5,12);
  }
  speedCur=Math.min(speedCur+H*.002,speedBase*1.9);
  if(Math.random()<.16)spawnPowerup(cx,cy);
  updateHUD(true);
  checkCleared();
}
function queueExplosion(r,c,delay){
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;
    const rr=r+dr,cc=c+dc;
    if(rr<0||cc<0||rr>=grid.rows||cc>=grid.cols)continue;
    const br=gridMap[rr]&&gridMap[rr][cc];
    if(br&&!br.dead&&!TYPES[br.ch].solid)queue.push({br,t:delay});
  }
}
function checkCleared(){
  if(S.state!=='playing')return;
  if(!bricks.some(b=>!b.dead&&!TYPES[b.ch].solid))levelClear();
}

/* ================= powerups ================= */
function spawnPowerup(x,y){
  const r=Math.random();
  const k=r<.4?'M':r<.75?'W':'S';
  powerups.push({k,x,y,t:0});
}
function multiball(){
  const src=balls.find(b=>!b.attached)||balls[0];
  if(!src)return;
  const base=(src.vx===0&&src.vy===0)?-Math.PI/2:Math.atan2(src.vy,src.vx);
  for(const off of[-.5,.5]){
    if(balls.length>=12)break;
    const a=base+off,sp=speedCur*(slowT>0?.62:1);
    balls.push({x:src.x,y:src.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:ballR(),attached:false,trail:[]});
  }
}
function applyPower(k){
  SFX.power();
  floats.push({x:paddle.x,y:paddle.y-26,text:PDEF[k].name,life:1,max:1,size:15,color:PDEF[k].c});
  if(k==='M')multiball();
  else if(k==='W'){wideT=12;paddle.tw=clamp(W*.34,110,220);}
  else slowT=8;
}

/* ================= particles / floats ================= */
function spawnShatter(x,y,T,n,scale){
  if(particles.length>340)return;
  for(let i=0;i<n;i++){
    particles.push({shape:'rect',x,y,vx:rand(-170,170)*scale,vy:rand(-270,40)*scale,
      size:rand(3,7),rot:rand(0,TAU),vr:rand(-9,9),life:rand(.4,.85),max:.85,
      color:[T.c,T.hi,T.lo][i%3]});
  }
  for(let i=0;i<4;i++)
    particles.push({shape:'spark',x,y,vx:rand(-260,260),vy:rand(-260,260),
      life:.25,max:.25,color:'#fff3d6'});
}

/* ================= flow ================= */
const show=id=>$(id).classList.add('show'),hide=id=>$(id).classList.remove('show');
function hideAll(){['#ovMenu','#ovClear','#ovOver','#ovWin','#ovPause'].forEach(hide);}
function updateHUD(pop){
  const el=$('#hudScore');
  if(el.textContent!=String(S.score)){el.textContent=S.score;
    if(pop){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}}
  $('#hudBest').textContent=save.best;
  $('#hudLevel').textContent=(S.level+1)+'/'+LEVELS.length;
  let lh='';for(let i=0;i<3;i++)lh+=`<span class="life${i<S.lives?' on':''}"></span>`;
  $('#hudLives').innerHTML=lh;
}
function startRun(lvl){
  hideAll();
  S.score=0;S.lives=3;S.combo=0;bestAtStart=save.best;
  loadLevel(lvl);S.state='playing';introT=1.8;updateHUD();
}
function loseLife(){
  S.lives--;S.combo=0;flashT=.35;shake=12;SFX.life();
  powerups=[];slowT=0;wideT=0;paddle.tw=basePW();
  speedCur=speedBase;updateHUD();
  if(S.lives<=0)gameOver();else spawnAttachedBall();
}
function gameOver(){
  S.state='over';persist();SFX.over();
  $('#ovScore').textContent=S.score;
  $('#ovBest').textContent=save.best;
  $('#ovNewBest').style.display=S.score>bestAtStart&&S.score>0?'inline-block':'none';
  show('#ovOver');
}
function levelClear(){
  S.state='clear';SFX.clear();
  const bonus=S.lives*250;
  const lvlScore=S.score-lvlScoreStart;
  S.score+=bonus;
  if(S.score>save.best)save.best=S.score;
  save.maxLevel=Math.max(save.maxLevel,Math.min(S.level+2,LEVELS.length));
  persist();updateHUD();
  if(S.level+1>=LEVELS.length){
    $('#winScore').textContent=S.score;show('#ovWin');return;
  }
  $('#clearTitle').textContent='LEVEL '+(S.level+1)+' CLEAR!';
  $('#cLvl').textContent=lvlScore;
  $('#cBonus').textContent='+'+bonus;
  $('#cTotal').textContent=S.score;
  setTimeout(()=>show('#ovClear'),450);
}
function showMenu(){
  S.state='menu';
  loadLevel(Math.min(save.maxLevel,LEVELS.length)-1); // progress ka preview
  hideAll();
  $('#menuBest').textContent=save.best;
  $('#menuProg').textContent='LEVEL '+save.maxLevel;
  const bc=$('#btnContinue');
  if(save.maxLevel>1){bc.style.display='block';bc.textContent='CONTINUE \u00B7 LEVEL '+save.maxLevel;}
  else bc.style.display='none';
  updateHUD();show('#ovMenu');
}

/* ================= update ================= */
function bouncePaddle(b){
  b.y=paddle.y-b.r-.5;
  const rel=clamp((b.x-paddle.x)/(paddle.w/2),-1,1);
  const sp=Math.hypot(b.vx,b.vy)||1;
  const a=rel*1.05; // max ~60deg
  b.vx=Math.sin(a)*sp;b.vy=-Math.cos(a)*sp;
  speedCur=Math.min(speedCur+H*.004,speedBase*1.9);
  S.combo=0;paddle.squash=1;SFX.paddle();
}
function updateBalls(dt){
  const target=speedCur*(slowT>0?.62:1);
  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i];
    if(b.attached){b.x=paddle.x;b.y=paddle.y-b.r-2;b.trail.length=0;continue;}
    const sp=Math.hypot(b.vx,b.vy)||1;
    b.vx*=target/sp;b.vy*=target/sp;
    // anti-stall: bahut horizontal na ho jaye
    const minVy=target*.18;
    if(Math.abs(b.vy)<minVy){
      b.vy=(b.vy<0?-1:1)*minVy;
      const k=Math.sqrt(Math.max(target*target-b.vy*b.vy,0));
      b.vx=(b.vx<0||b.vx===0?-1:1)*k;
    }
    const dist=target*dt,steps=Math.max(1,Math.ceil(dist/(b.r*.8))),sdt=dt/steps;
    for(let s=0;s<steps;s++){
      b.x+=b.vx*sdt;b.y+=b.vy*sdt;
      if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);SFX.wall();}
      else if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);SFX.wall();}
      if(b.y<b.r+HUD_H){b.y=b.r+HUD_H;b.vy=Math.abs(b.vy);SFX.wall();}
      if(b.vy>0&&b.y+b.r>=paddle.y&&b.y-b.r<paddle.y+paddle.h&&
         b.x>paddle.x-paddle.w/2-b.r&&b.x<paddle.x+paddle.w/2+b.r)bouncePaddle(b);
      hitBricks(b);
      if(b.y-b.r>H){balls.splice(i,1);break;}
    }
    if(balls[i]===b){b.trail.push({x:b.x,y:b.y});if(b.trail.length>9)b.trail.shift();}
  }
  if(balls.length===0&&S.state==='playing')loseLife();
}
function update(dt,t){
  shake=Math.max(0,shake-dt*34);
  flashT=Math.max(0,flashT-dt);
  introT=Math.max(0,introT-dt);
  paddle.squash=Math.max(0,paddle.squash-dt*6);
  // particles + floats hamesha chalte rahenge
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];
    p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}
    if(p.shape==='ring'){p.r+=p.vr*dt;continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.shape==='rect'){p.vy+=850*dt;p.rot+=p.vr*dt;}}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];
    f.life-=dt;f.y-=42*dt;if(f.life<=0)floats.splice(i,1);}

  if(S.state!=='playing')return;

  // paddle follow
  paddle.x+=(clamp(targetX,paddle.w/2,W-paddle.w/2)-paddle.x)*Math.min(1,dt*20);
  paddle.w+=(paddle.tw-paddle.w)*Math.min(1,dt*10);
  if(wideT>0){wideT-=dt;if(wideT<=0){wideT=0;paddle.tw=basePW();}}
  if(slowT>0)slowT-=dt;

  // explosive chain queue
  for(let i=queue.length-1;i>=0;i--){
    queue[i].t-=dt;
    if(queue[i].t<=0){
      const br=queue[i].br;queue.splice(i,1);
      if(br.dead)continue;
      const wasE=TYPES[br.ch].explosive;
      destroyBrick(br,false);
      if(wasE){queueExplosion(br.r,br.c,.09);shake=Math.min(shake+5,16);}
    }
  }

  updateBalls(dt);

  // powerups
  for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];
    p.y+=H*.3*dt;p.t+=dt;
    if(p.y+22>=paddle.y&&p.y<=paddle.y+paddle.h+6&&Math.abs(p.x-paddle.x)<paddle.w/2+16){
      applyPower(p.k);powerups.splice(i,1);continue;}
    if(p.y>H)powerups.splice(i,1);}

  $('#tapHint').classList.toggle('show',balls.some(b=>b.attached));
}

/* ================= render ================= */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawBricks(t){
  for(const b of bricks){
    if(b.dead)continue;
    const T=TYPES[b.ch],x=b.x,y=b.y,w=grid.bw,h=grid.bh;
    ctx.fillStyle=T.c;rr(x,y,w,h,4);ctx.fill();
    ctx.fillStyle=T.hi;ctx.fillRect(x+2,y+2,w-4,2);
    ctx.fillStyle=T.lo;ctx.fillRect(x+2,y+h-4,w-4,2);
    if(T.solid){
      ctx.strokeStyle='rgba(11,13,18,.45)';ctx.lineWidth=2;
      rr(x+4,y+4,w-8,h-8,3);ctx.stroke();
      ctx.fillStyle='rgba(11,13,18,.5)';
      ctx.beginPath();ctx.arc(x+8,y+h/2,1.8,0,TAU);ctx.arc(x+w-8,y+h/2,1.8,0,TAU);ctx.fill();
    }
    if(T.explosive){
      ctx.fillStyle='#1b0a10';
      ctx.beginPath();ctx.arc(x+w/2,y+h/2,Math.min(w,h)*.3,0,TAU);ctx.fill();
      ctx.fillStyle='#ffdce5';
      ctx.beginPath();ctx.arc(x+w/2,y+h/2,2.6+Math.sin(t*.006+b.seed*9)*1.3,0,TAU);ctx.fill();
    }
    if(b.hp<T.hp){ // cracks
      const n=(T.hp-b.hp)*2;
      ctx.strokeStyle='rgba(12,10,8,.55)';ctx.lineWidth=1.4;ctx.beginPath();
      for(let k=0;k<n;k++){
        const s1=hash(b.seed*91.7+k*17.3),s2=hash(b.seed*57.3+k*29.1);
        let px=x+w*(.15+.7*s1),py=y+h*(.2+.6*s2);
        ctx.moveTo(px,py);
        for(let seg=0;seg<3;seg++){
          px+=(hash(b.seed+k*3.1+seg*13.7)-.5)*w*.3;
          py+=(hash(b.seed+k*5.7+seg*3.3)-.3)*h*.5;
          ctx.lineTo(px,py);
        }
      }
      ctx.stroke();
    }
  }
}
function render(t){
  ctx.fillStyle='#0b0d12';ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));

  drawBricks(t);

  // powerups
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of powerups){
    const w=34,h=22,x=p.x-w/2+Math.sin(p.t*5)*1.4,y=p.y;
    ctx.fillStyle=PDEF[p.k].c;rr(x,y,w,h,h/2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5;
    rr(x+1.5,y+1.5,w-3,h-3,h/2-1);ctx.stroke();
    ctx.fillStyle='#0d0f14';ctx.font=`700 ${h*.58|0}px 'Chakra Petch'`;
    ctx.fillText(PDEF[p.k].label,x+w/2,y+h/2+1);
  }

  // particles
  for(const p of particles){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    if(p.shape==='ring'){
      ctx.strokeStyle=p.color;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.stroke();
    }else if(p.shape==='spark'){
      ctx.strokeStyle=p.color;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);ctx.stroke();
    }else{
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.7);
      ctx.restore();
    }
  }
  ctx.globalAlpha=1;

  // paddle
  {
    const w=paddle.w*(1+paddle.squash*.12),h=paddle.h*(1-paddle.squash*.25);
    const y=paddle.y+(paddle.h-h);
    ctx.fillStyle='#ffc233';rr(paddle.x-w/2,y,w,h,h/2);ctx.fill();
    ctx.fillStyle='#b8860f';rr(paddle.x-w/2,y+h-3,w,3,1.5);ctx.fill();
    ctx.fillStyle='#171203';
    rr(paddle.x-5,y+h/2-2,10,4,2);ctx.fill();
  }

  // balls + amber trail
  for(const b of balls){
    for(let i=0;i<b.trail.length;i++){
      const tp=b.trail[i],k=(i+1)/b.trail.length;
      ctx.globalAlpha=k*.22;ctx.fillStyle='#ffc233';
      ctx.beginPath();ctx.arc(tp.x,tp.y,b.r*k,0,TAU);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff6e3';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();
    ctx.fillStyle='#ffc233';
    ctx.beginPath();ctx.arc(b.x-b.r*.3,b.y-b.r*.3,b.r*.35,0,TAU);ctx.fill();
    if(b.attached&&S.state==='playing'){ // aim guide
      ctx.globalAlpha=.35+.2*Math.sin(t*.006);
      ctx.strokeStyle='#ffc233';ctx.lineWidth=1.5;ctx.setLineDash([4,7]);
      ctx.beginPath();ctx.moveTo(b.x,b.y-b.r-4);ctx.lineTo(b.x,b.y-74);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
  }

  // floating texts
  for(const f of floats){
    ctx.globalAlpha=clamp(f.life/f.max,0,1);
    ctx.font=`700 ${f.size}px 'Chakra Petch'`;
    ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;

  // level intro
  if(introT>0&&S.state==='playing'){
    ctx.globalAlpha=Math.min(introT,.5)/.5;
    ctx.textAlign='center';
    ctx.font=`${Math.min(W*.09,34)|0}px 'Bungee'`;ctx.fillStyle='#ffc233';
    ctx.fillText('LEVEL '+(S.level+1),W/2,H*.44);
    ctx.font="600 12px 'Chakra Petch'";ctx.fillStyle='#aeb6c4';
    const nm=LEVELS[S.level].name;
    ctx.fillText(nm.split('').join('\u2009'),W/2,H*.44+26);
    ctx.globalAlpha=1;
  }
  ctx.restore();

  if(flashT>0){ctx.fillStyle=`rgba(255,61,110,${flashT*.45})`;ctx.fillRect(0,0,W,H);}
}

/* ================= input ================= */
let pDown=false;
function setTarget(e){targetX=clamp(e.clientX,paddle.w/2,W-paddle.w/2);}
addEventListener('pointerdown',e=>{
  if(e.target.closest('.ui'))return;
  audio();pDown=true;setTarget(e);
  if(S.state==='playing'&&balls.some(b=>b.attached))launchBalls();
});
addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'||pDown)setTarget(e);
});
addEventListener('pointerup',()=>pDown=false);
addEventListener('pointercancel',()=>pDown=false);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('contextmenu',e=>e.preventDefault());
const keys={};
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '&&S.state==='playing'){audio();launchBalls();}
  if((e.key==='p'||e.key==='P'||e.key==='Escape')){
    if(S.state==='playing')doPause();else if(S.state==='paused')doResume();
  }
});
addEventListener('keyup',e=>keys[e.key]=false);

/* ================= buttons ================= */
function doPause(){if(S.state!=='playing')return;S.state='paused';persist();show('#ovPause');}
function doResume(){if(S.state!=='paused')return;S.state='playing';hide('#ovPause');}
function refreshSound(){
  $('#icoSndOn').style.display=muted?'none':'block';
  $('#icoSndOff').style.display=muted?'block':'none';
}
 $('#btnPause').addEventListener('click',()=>{audio();S.state==='paused'?doResume():doPause();});
 $('#btnResume').addEventListener('click',doResume);
 $('#btnRestart').addEventListener('click',()=>startRun(0));
 $('#btnSound').addEventListener('click',()=>{muted=!muted;save.muted=muted;persist();refreshSound();audio();});
 $('#btnPlay').addEventListener('click',()=>{audio();startRun(0);});
 $('#btnContinue').addEventListener('click',()=>{audio();startRun(Math.min(save.maxLevel,LEVELS.length)-1);});
 $('#btnNext').addEventListener('click',()=>{hideAll();loadLevel(S.level+1);S.state='playing';introT=1.8;lvlScoreStart=S.score;updateHUD();});
 $('#btnClearMenu').addEventListener('click',showMenu);
 $('#btnRetry').addEventListener('click',()=>startRun(0));
 $('#btnOverMenu').addEventListener('click',showMenu);
 $('#btnAgain').addEventListener('click',()=>startRun(0));
 $('#btnWinMenu').addEventListener('click',showMenu);
 $('#btnPauseMenu').addEventListener('click',showMenu);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.state==='playing')doPause();});
addEventListener('resize',layout);
addEventListener('orientationchange',()=>setTimeout(layout,120));

/* ================= main loop ================= */
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min((t-last)/1000,.033);last=t;
  // keyboard paddle (desktop)
  if(S.state==='playing'){
    if(keys.ArrowLeft)targetX-=620*dt;
    if(keys.ArrowRight)targetX+=620*dt;
    targetX=clamp(targetX,paddle.w/2,W-paddle.w/2);
  }
  update(dt,t);
  render(t);
}
/* init */
refreshSound();
layout();
showMenu();
requestAnimationFrame(frame);
})();
</script>
