/* ============ Fruit artwork ============ */
function spark4(g,x,y,r,color){
  g.save();g.translate(x,y);g.fillStyle=color;
  g.beginPath();
  g.moveTo(0,-r);g.quadraticCurveTo(r*0.18,-r*0.18,r,0);g.quadraticCurveTo(r*0.18,r*0.18,0,r);
  g.quadraticCurveTo(-r*0.18,r*0.18,-r,0);g.quadraticCurveTo(-r*0.18,-r*0.18,0,-r);
  g.closePath();g.fill();g.restore();
}
function applePath(g){
  g.beginPath();
  g.moveTo(0,-13);
  g.bezierCurveTo(9,-21,22,-16,22,-2);
  g.bezierCurveTo(22,12,13,22,0,22);
  g.bezierCurveTo(-13,22,-22,12,-22,-2);
  g.bezierCurveTo(-22,-16,-9,-21,0,-13);
  g.closePath();
}
function drawApple(g){
  applePath(g);
  var rg=g.createRadialGradient(-7,-8,3,0,0,30);
  rg.addColorStop(0,'#FF8A70');rg.addColorStop(0.55,'#E8403C');rg.addColorStop(1,'#C22B35');
  g.fillStyle=rg;g.fill();
  g.fillStyle='rgba(255,255,255,0.32)';
  g.beginPath();g.ellipse(-9,-6,4.5,8,0.45,0,Math.PI*2);g.fill();
  g.strokeStyle='#7A4A21';g.lineWidth=3.4;g.lineCap='round';
  g.beginPath();g.moveTo(0,-14);g.quadraticCurveTo(1,-20,4,-24);g.stroke();
  g.fillStyle='#5FA845';
  g.beginPath();g.moveTo(4,-20);
  g.quadraticCurveTo(13,-27,18,-21);g.quadraticCurveTo(11,-14,4,-20);g.closePath();g.fill();
}
function drawGolden(g){
  applePath(g);
  var rg=g.createRadialGradient(-7,-8,3,0,0,30);
  rg.addColorStop(0,'#FFF3B0');rg.addColorStop(0.55,'#FFC93C');rg.addColorStop(1,'#DE9A12');
  g.fillStyle=rg;g.fill();
  g.strokeStyle='rgba(160,110,10,0.5)';g.lineWidth=1.5;g.stroke();
  g.fillStyle='rgba(255,255,255,0.5)';
  g.beginPath();g.ellipse(-9,-6,4.5,8,0.45,0,Math.PI*2);g.fill();
  g.strokeStyle='#9C6B14';g.lineWidth=3.4;g.lineCap='round';
  g.beginPath();g.moveTo(0,-14);g.quadraticCurveTo(1,-20,4,-24);g.stroke();
  spark4(g,9,-4,4,'rgba(255,255,255,0.95)');
  spark4(g,-8,9,3,'rgba(255,255,255,0.8)');
}
function drawRotten(g){
  applePath(g);
  var rg=g.createRadialGradient(-6,-7,3,0,0,30);
  rg.addColorStop(0,'#9C9159');rg.addColorStop(0.6,'#6E6636');rg.addColorStop(1,'#4A4426');
  g.fillStyle=rg;g.fill();
  g.fillStyle='rgba(40,36,16,0.5)';
  g.beginPath();g.ellipse(7,5,6.5,5,0.4,0,Math.PI*2);g.fill();
  g.beginPath();g.ellipse(-8,-3,5,4,-0.4,0,Math.PI*2);g.fill();
  g.strokeStyle='rgba(30,28,12,0.45)';g.lineWidth=1.3;
  g.beginPath();g.moveTo(-4,10);g.quadraticCurveTo(0,13,5,11);g.stroke();
  g.strokeStyle='#5C431E';g.lineWidth=3.2;g.lineCap='round';
  g.beginPath();g.moveTo(0,-14);g.quadraticCurveTo(2,-19,1,-23);g.stroke();
  g.strokeStyle='rgba(150,160,100,0.65)';g.lineWidth=2;g.lineCap='round';
  g.beginPath();g.moveTo(-4,-24);g.quadraticCurveTo(-9,-29,-4,-33);g.quadraticCurveTo(1,-37,-3,-41);g.stroke();
}
function drawOrange(g){
  g.beginPath();g.arc(0,1,19,0,Math.PI*2);
  var rg=g.createRadialGradient(-6,-6,3,0,1,23);
  rg.addColorStop(0,'#FFC96E');rg.addColorStop(0.55,'#FF9E33');rg.addColorStop(1,'#EF7D11');
  g.fillStyle=rg;g.fill();
  g.fillStyle='rgba(255,235,190,0.5)';
  var dots=[[7,6],[-8,7],[3,12],[-3,-4],[11,-3],[-12,0]];
  for(var i=0;i<dots.length;i++){g.beginPath();g.arc(dots[i][0],dots[i][1],1.2,0,Math.PI*2);g.fill();}
  g.fillStyle='rgba(255,255,255,0.3)';
  g.beginPath();g.ellipse(-7,-6,4,6.5,0.5,0,Math.PI*2);g.fill();
  g.fillStyle='#4E8C3A';
  for(var j=0;j<4;j++){
    g.save();g.translate(0,-17);g.rotate(j*Math.PI/2+0.4);
    g.beginPath();g.ellipse(0,3,2.4,5,0,0,Math.PI*2);g.fill();g.restore();
  }
  g.fillStyle='#7A4A21';g.beginPath();g.arc(0,-17,2.4,0,Math.PI*2);g.fill();
}
function drawBanana(g){
  g.beginPath();
  g.moveTo(-25,-9);
  g.quadraticCurveTo(0,-1,25,-9);
  g.quadraticCurveTo(0,25,-25,-9);
  g.closePath();
  var lg=g.createLinearGradient(0,-9,0,20);
  lg.addColorStop(0,'#FFE47A');lg.addColorStop(1,'#F4B92E');
  g.fillStyle=lg;g.fill();
  g.strokeStyle='rgba(214,142,20,0.65)';g.lineWidth=2.6;g.lineCap='round';
  g.beginPath();g.moveTo(22,-8);g.quadraticCurveTo(0,21,-22,-8);g.stroke();
  g.strokeStyle='rgba(255,255,255,0.45)';g.lineWidth=2;
  g.beginPath();g.moveTo(-14,-5);g.quadraticCurveTo(0,1,13,-5);g.stroke();
  g.fillStyle='#7A4A21';
  g.beginPath();g.arc(-25,-9,2.6,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(25,-9,2.6,0,Math.PI*2);g.fill();
}
function drawStrawberry(g){
  g.beginPath();
  g.moveTo(0,21);
  g.bezierCurveTo(13,15,18,2,16,-8);
  g.bezierCurveTo(13,-17,-13,-17,-16,-8);
  g.bezierCurveTo(-18,2,-13,15,0,21);
  g.closePath();
  var rg=g.createRadialGradient(-6,-7,3,0,0,26);
  rg.addColorStop(0,'#FF7A85');rg.addColorStop(0.55,'#EE4157');rg.addColorStop(1,'#CB2140');
  g.fillStyle=rg;g.fill();
  g.fillStyle='#FFE9A8';
  var seeds=[[-8,-4],[0,-7],[8,-4],[-11,3],[11,3],[-5,7],[5,7],[0,13]];
  for(var i=0;i<seeds.length;i++){g.beginPath();g.ellipse(seeds[i][0],seeds[i][1],1.3,1.9,0,0,Math.PI*2);g.fill();}
  g.fillStyle='#4E9C3C';
  for(var j=0;j<5;j++){
    g.save();g.translate(0,-13);g.rotate((j-2)*0.5);
    g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(3,-7,0,-11);g.quadraticCurveTo(-3,-7,0,0);g.closePath();g.fill();
    g.restore();
  }
}
function drawGrapes(g){
  g.strokeStyle='#7A4A21';g.lineWidth=3;g.lineCap='round';
  g.beginPath();g.moveTo(0,-16);g.quadraticCurveTo(1,-21,4,-24);g.stroke();
  g.fillStyle='#5FA845';
  g.beginPath();g.moveTo(2,-19);
  g.quadraticCurveTo(12,-26,16,-19);g.quadraticCurveTo(10,-12,2,-19);g.closePath();g.fill();
  g.fillStyle='#5F3590';
  g.beginPath();g.arc(0,1,9.5,0,Math.PI*2);g.fill();
  var pos=[[-12,-7],[0,-11],[12,-7],[-6,5],[6,5],[0,16]];
  for(var i=0;i<pos.length;i++){
    var p=pos[i];
    var rg=g.createRadialGradient(p[0]-3,p[1]-3,2,p[0],p[1],10);
    rg.addColorStop(0,'#A878DC');rg.addColorStop(0.6,'#7C4AB8');rg.addColorStop(1,'#5F3590');
    g.fillStyle=rg;
    g.beginPath();g.arc(p[0],p[1],9.5,0,Math.PI*2);g.fill();
    g.fillStyle='rgba(255,255,255,0.35)';
    g.beginPath();g.ellipse(p[0]-3,p[1]-3,2.4,3.4,0.4,0,Math.PI*2);g.fill();
  }
}
function drawPineapple(g){
  for(var i=0;i<5;i++){
    g.save();g.translate(0,-14);g.rotate((i-2)*0.42);
    g.fillStyle=i%2?'#57A84B':'#3F8F3B';
    g.beginPath();g.moveTo(0,2);g.quadraticCurveTo(4,-9,0,-17);g.quadraticCurveTo(-4,-9,0,2);g.closePath();g.fill();
    g.restore();
  }
  g.beginPath();g.ellipse(0,8,17,24,0,0,Math.PI*2);
  var rg=g.createRadialGradient(-6,-2,3,0,8,28);
  rg.addColorStop(0,'#FFD25E');rg.addColorStop(0.55,'#F0A72B');rg.addColorStop(1,'#C97F14');
  g.fillStyle=rg;g.fill();
  g.save();g.clip();
  g.strokeStyle='rgba(122,74,20,0.3)';g.lineWidth=1.4;
  for(var k=-4;k<=4;k++){
    g.beginPath();g.moveTo(k*7-24,-20);g.lineTo(k*7+24,36);g.stroke();
    g.beginPath();g.moveTo(k*7+24,-20);g.lineTo(k*7-24,36);g.stroke();
  }
  g.restore();
  g.fillStyle='rgba(255,255,255,0.22)';
  g.beginPath();g.ellipse(-7,-2,4,9,0.3,0,Math.PI*2);g.fill();
}
function drawWatermelon(g){
  g.beginPath();g.ellipse(0,2,30,25,0,0,Math.PI*2);
  var rg=g.createRadialGradient(-9,-9,4,0,2,36);
  rg.addColorStop(0,'#6BC86F');rg.addColorStop(0.55,'#3E9B44');rg.addColorStop(1,'#2E7534');
  g.fillStyle=rg;g.fill();
  g.save();g.clip();
  g.strokeStyle='rgba(25,80,32,0.7)';g.lineWidth=5;g.lineCap='round';
  for(var i=-2;i<=2;i++){
    var x=i*11.5;
    g.beginPath();g.moveTo(x*0.5,-24);g.quadraticCurveTo(x*1.35,2,x*0.5,28);g.stroke();
  }
  g.restore();
  g.strokeStyle='#7A4A21';g.lineWidth=2.6;g.lineCap='round';
  g.beginPath();g.moveTo(0,-23);g.quadraticCurveTo(2,-30,7,-28);g.stroke();
  g.fillStyle='rgba(255,255,255,0.28)';
  g.beginPath();g.ellipse(-13,-9,7.5,4,-0.5,0,Math.PI*2);g.fill();
}
function starPath(g,R,r,rot){
  g.beginPath();
  for(var i=0;i<10;i++){
    var rad=i%2?r:R,a=rot+Math.PI*i/5;
    var x=Math.cos(a)*rad,y=Math.sin(a)*rad;
    if(i)g.lineTo(x,y);else g.moveTo(x,y);
  }
  g.closePath();
}
function drawStarFruit(g){
  starPath(g,23,13,-Math.PI/2);
  var rg=g.createRadialGradient(-5,-6,2,0,0,26);
  rg.addColorStop(0,'#FFE97A');rg.addColorStop(1,'#E3AF1E');
  g.fillStyle=rg;g.fill();
  g.strokeStyle='rgba(170,120,15,0.55)';g.lineWidth=1.6;g.lineJoin='round';g.stroke();
  starPath(g,13,7.5,-Math.PI/2);
  g.fillStyle='#FBEFA0';g.fill();
  g.fillStyle='#B98E1B';
  g.beginPath();g.arc(-3,0,1.5,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(3,0,1.5,0,Math.PI*2);g.fill();
  spark4(g,12,-11,3.5,'rgba(255,255,255,0.9)');
}
function drawClock(g){
  g.fillStyle='#2FA3B8';
  g.beginPath();g.arc(-13,-17,6,Math.PI,Math.PI*2);g.fill();
  g.beginPath();g.arc(13,-17,6,Math.PI,Math.PI*2);g.fill();
  g.beginPath();g.arc(0,-19,3.4,0,Math.PI*2);g.fill();
  g.strokeStyle='#20788A';g.lineWidth=3.4;g.lineCap='round';
  g.beginPath();g.moveTo(-12,16);g.lineTo(-16,21);g.stroke();
  g.beginPath();g.moveTo(12,16);g.lineTo(16,21);g.stroke();
  g.beginPath();g.arc(0,0,19,0,Math.PI*2);
  var rg=g.createRadialGradient(-6,-6,3,0,0,22);
  rg.addColorStop(0,'#5BC6D8');rg.addColorStop(0.6,'#2FA3B8');rg.addColorStop(1,'#1E7C8E');
  g.fillStyle=rg;g.fill();
  g.strokeStyle='rgba(20,80,95,0.5)';g.lineWidth=1.5;g.stroke();
  g.fillStyle='#F4FDFF';
  g.beginPath();g.arc(0,0,14,0,Math.PI*2);g.fill();
  g.fillStyle='#8FB9C2';
  for(var i=0;i<4;i++){
    var a=i*Math.PI/2;
    g.beginPath();g.arc(Math.cos(a)*10.5,Math.sin(a)*10.5,1.1,0,Math.PI*2);g.fill();
  }
  g.strokeStyle='#20788A';g.lineWidth=2.6;g.lineCap='round';
  g.beginPath();g.moveTo(0,0);g.lineTo(0,-8);g.stroke();
  g.beginPath();g.moveTo(0,0);g.lineTo(6,3);g.stroke();
  g.fillStyle='#20788A';
  g.beginPath();g.arc(0,0,1.8,0,Math.PI*2);g.fill();
  spark4(g,14,4,3,'rgba(255,255,255,0.9)');
}
function drawHeartFruit(g){
  g.strokeStyle='#7A4A21';g.lineWidth=3;g.lineCap='round';
  g.beginPath();g.moveTo(0,-14);g.quadraticCurveTo(1,-19,3,-22);g.stroke();
  g.fillStyle='#5FA845';
  g.beginPath();g.moveTo(2,-18);
  g.quadraticCurveTo(11,-24,15,-18);g.quadraticCurveTo(9,-12,2,-18);g.closePath();g.fill();
  g.save();g.scale(1.45,1.45);
  g.beginPath();
  g.moveTo(0,12);
  g.bezierCurveTo(-16,-2,-9,-18,0,-8);
  g.bezierCurveTo(9,-18,16,-2,0,12);
  g.closePath();
  var rg=g.createRadialGradient(-5,-5,2,0,0,22);
  rg.addColorStop(0,'#FF9BB0');rg.addColorStop(0.55,'#F45B79');rg.addColorStop(1,'#D12F55');
  g.fillStyle=rg;g.fill();
  g.strokeStyle='rgba(150,25,60,0.5)';g.lineWidth=1.2;g.stroke();
  g.fillStyle='rgba(255,255,255,0.5)';
  g.beginPath();g.ellipse(-5.5,-5,2.8,4.5,0.45,0,Math.PI*2);g.fill();
  g.restore();
  g.fillStyle='#FFFDF5';
  rr(g,-3.4,4.2,6.8,2.6,1.3);g.fill();
  rr(g,-1.3,2.1,2.6,6.8,1.3);g.fill();
}

/* ============ Sprite cache ============ */
var sprites={};
function buildSprites(){
  sprites={};
  var S=Math.max(1,Math.min(2.5,(dpr||1)*Math.min(1.5,K)));
  for(var key in FRUIT_DEFS){
    var d=FRUIT_DEFS[key],pad=16;
    var c=document.createElement('canvas');
    c.width=Math.ceil((d.w+pad*2)*S);c.height=Math.ceil((d.h+pad*2)*S);
    var g=c.getContext('2d');
    g.scale(S,S);g.translate(d.w/2+pad,d.h/2+pad);
    d.draw(g);
    sprites[key]={c:c,dw:d.w+pad*2,dh:d.h+pad*2,ox:d.w/2+pad,oy:d.h/2+pad};
  }
}
function drawFruitSprite(g,f){
  var sp=sprites[f.type];if(!sp)return;
  g.save();g.translate(f.x,f.y);g.rotate(f.rot);
  g.drawImage(sp.c,-sp.ox,-sp.oy,sp.dw,sp.dh);
  g.restore();
}
function drawSpriteOn(context,key,x,y,target){
  var sp=sprites[key];if(!sp)return;
  var s=target/Math.max(sp.dw,sp.dh);
  context.drawImage(sp.c,x-sp.dw*s/2,y-sp.dh*s/2,sp.dw*s,sp.dh*s);
}

/* ============ Audio ============ */
var actx=null;
function initAudio(){
  if(actx)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(AC)actx=new AC();
  }catch(e){actx=null;}
}
function tone(freq,dur,type,vol,when,slide){
  if(!actx||!settings.sound)return;
  try{
    var t0=actx.currentTime+(when||0);
    var o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.1,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(actx.destination);
    o.start(t0);o.stop(t0+dur+0.05);
  }catch(e){}
}
function sfx(name,pts){
  if(!actx)return;
  if(actx.state==='suspended'){try{actx.resume();}catch(e){}}
  if(name==='catch'){var f=430+(pts||10)*6;tone(f,0.12,'triangle',0.09);tone(f*1.5,0.09,'sine',0.05,0.03);}
  else if(name==='gold'){tone(660,0.10,'triangle',0.09);tone(880,0.10,'triangle',0.09,0.07);tone(1320,0.16,'triangle',0.09,0.14);}
  else if(name==='star'){tone(700,0.18,'sine',0.10,0,1500);tone(1050,0.12,'triangle',0.06,0.08);}
  else if(name==='slow'){tone(900,0.35,'sine',0.09,0,220);tone(450,0.30,'triangle',0.05,0.10,180);}
  else if(name==='heart'){tone(523,0.10,'triangle',0.08);tone(659,0.10,'triangle',0.08,0.09);tone(784,0.20,'triangle',0.08,0.18);}
  else if(name==='bad'){tone(160,0.20,'sawtooth',0.05,0,80);}
  else if(name==='miss'){tone(300,0.22,'sine',0.07,0,170);}
  else if(name==='play'){tone(520,0.10,'triangle',0.08);tone(660,0.12,'triangle',0.08,0.08);}
  else if(name==='tap'){tone(600,0.06,'triangle',0.06);}
  else if(name==='levelup'){tone(523,0.09,'triangle',0.08);tone(659,0.09,'triangle',0.08,0.08);tone(784,0.09,'triangle',0.08,0.16);tone(1046,0.18,'triangle',0.08,0.24);}
  else if(name==='newfruit'){tone(784,0.10,'triangle',0.08);tone(988,0.10,'triangle',0.08,0.09);tone(1318,0.20,'triangle',0.08,0.18);}
  else if(name==='over'){tone(392,0.16,'triangle',0.09);tone(330,0.16,'triangle',0.09,0.14);tone(262,0.30,'triangle',0.09,0.28);}
}

/* ============ Layout / resize ============ */
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  K=Math.max(0.72,Math.min(1.45,Math.min(W/390,H/720)));
  var st=0;try{st=parseFloat(getComputedStyle(probe).paddingTop)||0;}catch(e){}
  safeTop=st;
  groundH=Math.max(52,Math.min(92,66*K));
  groundTop=H-groundH;
  basket.w=96*K;basket.h=54*K;
  basket.y=groundTop-basket.h*0.5+5*K;
  basket.x=clampX(basket.x||W/2);
  basket.tx=clampX(basket.tx||W/2);
  buildSprites();
}

/* ============ Drawing helpers ============ */
function rr(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
function text(str,x,y,size,color,align,weight,stroke){
  ctx.font=(weight||500)+' '+size+'px Fredoka, sans-serif';
  ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  if(stroke){ctx.lineWidth=Math.max(3,size*0.16);ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(str,x,y);}
  ctx.fillStyle=color;ctx.fillText(str,x,y);
}
function glow(x,y,r,color){
  var g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color);g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function drawHeart(x,y,s,filled){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.beginPath();
  ctx.moveTo(0,4.5);
  ctx.bezierCurveTo(-7.5,-3,-3.5,-10,0,-5);
  ctx.bezierCurveTo(3.5,-10,7.5,-3,0,4.5);
  ctx.closePath();
  ctx.fillStyle=filled?'#E5484D':'rgba(120,90,70,0.28)';
  ctx.fill();
  if(filled){
    ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.beginPath();ctx.ellipse(-2.6,-3.4,1.6,2.4,0.5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function tuft(x,y,s){

function flower(x,y,c){

/* ============ Effects ============ */
function burst(x,y,colors,n,power){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,sp=(0.3+Math.random()*0.7)*power;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-70,
      life:0.45+Math.random()*0.35,t:0,size:(2+Math.random()*3)*K,color:colors[i%colors.length]});
  }
}
function ring(x,y,color){rings.push({x:x,y:y,t:0,color:color});}
function addPopup(x,y,txt,color,size){
  popups.push({x:Math.min(Math.max(x,40),W-40),y:y,text:txt,color:color,size:size,t:0,life:0.9});
}
function updateEffects(dt){
  var i;
  for(i=particles.length-1;i>=0;i--){
    var p=particles[i];p.t+=dt;
    if(p.t>=p.life){particles.splice(i,1);continue;}
    p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  if(particles.length>130)particles.splice(0,particles.length-130);
  for(i=popups.length-1;i>=0;i--){
    var q=popups[i];q.t+=dt;
    if(q.t>=q.life){popups.splice(i,1);continue;}
    q.y-=55*dt;
  }
  for(i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>0.35)rings.splice(i,1);}
  if(levelFlash>0)levelFlash-=dt;
  if(newFruitFlash>0)newFruitFlash-=dt;
  if(heartGainT>0)heartGainT-=dt;
}
function drawEffects(){
  var i;
  for(i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  for(i=0;i<rings.length;i++){
    var r=rings[i],pr=r.t/0.35;
    ctx.globalAlpha=1-pr;
    ctx.strokeStyle=r.color;ctx.lineWidth=3*(1-pr)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,10+pr*70*K,0,Math.PI*2);ctx.stroke();
  }
  for(i=0;i<popups.length;i++){
    var q=popups[i],qp=q.t/q.life;
    ctx.globalAlpha=qp<0.15?qp/0.15:Math.max(0,1-Math.max(0,(qp-0.55)/0.45));
    text(q.text,q.x,q.y,q.size,q.color,'center',700,'rgba(255,250,235,0.85)');
  }
  ctx.globalAlpha=1;
}

/* ============ Spawning ============ */
function weightedRegular(lv){
  var pool=[],tw=0,i;
  for(i=0;i<UNLOCK.length;i++){
    if(lv>=UNLOCK[i][1]){var d=FRUIT_DEFS[UNLOCK[i][0]];pool.push([UNLOCK[i][0],d.weight]);tw+=d.weight;}
  }
  var r=Math.random()*tw;
  for(i=0;i<pool.length;i++){r-=pool[i][1];if(r<=0)return pool[i][0];}
  return 'apple';
}
function spawnFruit(demo){
  if(fruits.length>26)return;
  var type;
  if(demo){
    var dr=Math.random();
    if(dr<0.10)type='golden';
    else if(dr<0.13)type='clock';
    else type=weightedRegular(1);
  }else{
    var r=Math.random();
    var gp=0.03,sp=0.03,cl=0.025,ht=0.025;
    var rp=Math.min(0.20,0.05+0.022*(level-1));
    if(r<gp)type='golden';
    else if(r<gp+sp)type='star';
    else if(r<gp+sp+cl)type='clock';
    else if(r<gp+sp+cl+ht)type='heart';
    else if(r<gp+sp+cl+ht+rp)type='rotten';
    else type=weightedRegular(level);
  }
  var d=FRUIT_DEFS[type];
  var m=d.r+14;
  var x=m+Math.random()*(W-2*m);
  if(Math.abs(x-lastSpawnX)<70*K)x=m+Math.random()*(W-2*m);
  lastSpawnX=x;
  var base=demo?120:Math.min(560,150+40*(level-1));
  var speedMul=d.spd*(0.9+Math.random()*0.25);
  if(!demo&&level>=4&&(d.special==='rotten'||!d.special)&&Math.random()<Math.min(0.25,0.04*(level-3))){
    speedMul*=1.35;
  }
  fruits.push({type:type,def:d,x:x,y:-d.h-20,prevY:-d.h-20,
    vy:base*speedMul*(demo?0.75:1),
    rot:(Math.random()-0.5)*0.6,
    vr:(Math.random()<0.5?-1:1)*(0.6+Math.random()*1.2),
    trailT:0});
}
function catchFruit(f){
  var d=f.def,rimY=basket.y-basket.h*0.44;
  if(state==='home'){basket.squash=0.84;burst(f.x,rimY,d.burst,6,120);return;}
  basket.squash=0.78;
  if(d.special==='rotten'){
    score=Math.max(0,score-15);
    addPopup(f.x,rimY-14,'-15','#6E6636',22);
    burst(f.x,rimY,d.burst,10,150);shakeT=0.18;sfx('bad');vibrate(40);
  }else if(d.special==='gold'){
    var g=50*mult;score+=g;
    addPopup(f.x,rimY-14,'+'+g,'#DE9A12',24);
    burst(f.x,rimY,d.burst,16,220);ring(f.x,rimY,'#FFC93C');sfx('gold');vibrate(20);
  }else if(d.special==='star'){
    mult=2;multT=8;score+=5;
    addPopup(f.x,rimY-14,'x2!','#E3AF1A',24);
    burst(f.x,rimY,d.burst,14,200);ring(f.x,rimY,'#FFE97A');sfx('star');vibrate(20);
  }else if(d.special==='slow'){
    slowT=SLOW_TIME;
    addPopup(f.x,rimY-14,'SLOW-MO!','#1E7C8E',24);
    burst(f.x,rimY,d.burst,14,180);
    ring(f.x,rimY,'#5BC6D8');ring(f.x,rimY,'#2FA3B8');
    sfx('slow');vibrate(25);
  }else if(d.special==='heart'){
    if(lives<3){
      lives++;heartGainT=1.0;
      addPopup(f.x,rimY-14,'+1 LIFE!','#D12F55',24);
    }else{
      var hv=30*mult;score+=hv;
      addPopup(f.x,rimY-14,'+'+hv,'#D12F55',22);
    }
    burst(f.x,rimY,d.burst,14,180);ring(f.x,rimY,'#F45B79');
    sfx('heart');vibrate(25);
  }else{
    var v=d.pts*mult;score+=v;
    addPopup(f.x,rimY-14,'+'+v,'#B4642E',20);
    burst(f.x,rimY,d.burst,9,150);sfx('catch',d.pts);vibrate(15);
  }
}
function fruitLost(f){
  if(state==='home'){burst(f.x,groundTop-8,['#B9CE9A','#A3BC82'],4,70);return;}
  if(f.def.special){burst(f.x,groundTop-8,['#B9CE9A','#A3BC82'],4,70);return;}
  lives--;
  heartPulse=0.5;missFlashT=0.4;shakeT=0.15;
  burst(f.x,groundTop-8,['#B9CE9A','#7C8A52','#C9CBA3'],8,120);
  sfx('miss');vibrate(60);
  if(lives<=0)endGame();
}
function moveFruits(dt){
  var rimY=basket.y-basket.h*0.44;
  var fdt=dt*(slowT>0?SLOW_FACTOR:1);
  for(var i=fruits.length-1;i>=0;i--){
    var f=fruits[i];
    if(!f||!f.def)continue;
    f.prevY=f.y;
    f.y+=f.vy*fdt;f.rot+=f.vr*fdt;
    if(f.def.special==='gold'||f.def.special==='star'||f.def.special==='slow'){
      f.trailT-=dt;
      if(f.trailT<=0){
        f.trailT=0.09;
        particles.push({x:f.x+(Math.random()-0.5)*f.def.w*0.5,y:f.y+f.def.h*0.25,
          vx:(Math.random()-0.5)*25,vy:40,life:0.4,t:0,size:2.4*K,
          color:f.def.special==='gold'?'#FFD86B':(f.def.special==='slow'?'#A8E4EE':'#FFE97A')});
      }
    }
    var fbot=f.y+f.def.r*0.4,fpb=f.prevY+f.def.r*0.4;
    var within=Math.abs(f.x-basket.x)<=basket.w*0.43+f.def.r*0.3;
    var crossed=fbot>=rimY&&fpb<rimY;
    var inside=fbot>=rimY&&f.y-f.def.r*0.3<rimY+basket.h*0.5;
    if(within&&(crossed||inside)){catchFruit(f);fruits.splice(i,1);continue;}
    if(f.y+f.def.h*0.32>=groundTop){
      fruitLost(f);fruits.splice(i,1);
      if(state!=='playing'&&state!=='home')return;
    }
  }
}

/* ============ State transitions ============ */
function resetWorld(){
  fruits.length=0;particles.length=0;popups.length=0;rings.length=0;
  score=0;lives=3;level=1;levelFlash=0;
  newFruit=null;newFruitFlash=0;
  spawnAcc=-350;demoAcc=600;lastSpawnX=-999;
  mult=1;multT=0;slowT=0;
  shakeT=0;missFlashT=0;heartPulse=0;heartGainT=0;
  newBest=false;panelGoT=0;
  basket.x=W/2;basket.tx=W/2;basket.squash=1;basket.tilt=0;
  uiButtons=[];
}
function startGame(){
  resetWorld();settingsOpen=false;
  state='playing';sfx('play');
}
function goHome(){
  resetWorld();settingsOpen=false;panelT=0;
  state='home';
}
function endGame(){
  if(state!=='playing')return;
  state='gameover';panelGoT=0;
  fruits.length=0;slowT=0;
  newBest=score>best&&score>0;
  if(newBest){best=score;try{localStorage.setItem('fc_best',String(best));}catch(e){}}
  sfx('over');vibrate(120);
}

var usingTouch=false,mouseDown=false;
function onTap(x,y){
  if(state==='home'){
    if(settingsOpen){
      if(panelT<0.2)return;
      for(var s=0;s<settingsButtons.length;s++){
        var sb=settingsButtons[s];
        if(x>=sb.x&&x<=sb.x+sb.w&&y>=sb.y&&y<=sb.y+sb.h){
          sfx('tap');
          if(sb.action==='close'){settingsOpen=false;}
          else if(sb.action==='sound'){
            settings.sound=!settings.sound;
            try{localStorage.setItem('fc_sound',settings.sound?'1':'0');}catch(e){}
          }else if(sb.action==='vibrate'){
            settings.vibrate=!settings.vibrate;
            try{localStorage.setItem('fc_vibrate',settings.vibrate?'1':'0');}catch(e){}
            vibrate(30);
          }
          return;
        }
      }
      settingsOpen=false;
      return;
    }
    for(var i=0;i<homeButtons.length;i++){
      var hb=homeButtons[i];
      if(x>=hb.x&&x<=hb.x+hb.w&&y>=hb.y&&y<=hb.y+hb.h){
        sfx('tap');settingsOpen=true;panelT=0;
        return;
      }
    }
    startGame();
    return;
  }
  if(state==='gameover'&&panelGoT>0.35){
    for(var j=0;j<uiButtons.length;j++){
      var b=uiButtons[j];
      if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
        if(b.action==='restart')startGame();else goHome();
        return;
      }
    }
  }
}

/* ============ Update ============ */
function update(dt){
  var i;
  for(i=0;i<clouds.length;i++){clouds[i].x+=clouds[i].v*dt;if(clouds[i].x>1.18)clouds[i].x=-0.22;}
  if(state==='home'){
    basket.tx=clampX(W/2+Math.sin(time*0.55)*W*0.27+Math.sin(time*1.35)*W*0.07);
  }
  basket.x+=(basket.tx-basket.x)*Math.min(1,dt*14);
  basket.tilt=Math.max(-0.2,Math.min(0.2,
    basket.tilt+((basket.tx-basket.x)*0.006-basket.tilt)*Math.min(1,dt*10)));
  basket.squash+=(1-basket.squash)*Math.min(1,dt*9);
  if(shakeT>0)shakeT-=dt;
  if(missFlashT>0)missFlashT-=dt;
  if(heartPulse>0)heartPulse-=dt;
  if(settingsOpen)panelT+=dt;
  if(state==='gameover')panelGoT+=dt;
  updateEffects(dt);
  if(state==='home'){
    demoAcc+=dt*1000;
    if(demoAcc>=950){demoAcc=0;spawnFruit(true);}
    moveFruits(dt);
  }else if(state==='playing'){
    var nl=levelFromScore(score);
    if(nl>level){
      level=nl;levelFlash=2.0;
      ring(W/2,H*0.35,'#F2B02E');
      sfx('levelup');vibrate(30);
      for(var u=0;u<UNLOCK.length;u++){
        if(UNLOCK[u][1]===level){newFruit=UNLOCK[u][0];newFruitFlash=2.6;sfx('newfruit');break;}
      }
    }
    if(multT>0){multT-=dt;if(multT<=0)mult=1;}
    if(slowT>0)slowT-=dt;
    spawnAcc+=dt*1000;
    var interval=Math.max(420,1150-78*(level-1)),guard=0;
    while(spawnAcc>=interval&&guard<5){
      spawnAcc-=interval;guard++;
      spawnFruit(false);
      if(level>=3&&Math.random()<Math.min(0.45,0.10+0.05*(level-2)))spawnFruit(false);
    }
    moveFruits(dt);
  }
}

  var hx=px+24+bw2+12;
  ctx.fillStyle='#FFF1DC';rr(ctx,hx,by,bw2,btnH,14);ctx.fill();
  ctx.strokeStyle='#B4642E';ctx.lineWidth=2;rr(ctx,hx,by,bw2,btnH,14);ctx.stroke();
  text('HOME',hx+bw2/2,by+btnH/2+6,17,'#8A4B1E','center',700);
  ctx.restore();
  /* FIX: tap-areas bhi scaled panel ke exact button positions par */
  var b1x=W/2+((px+24)-W/2)*fit,          b1y=pcy+(by-pcy)*fit;
  var b2x=W/2+(hx-W/2)*fit,               b2y=b1y;
  uiButtons=[
    {x:b1x,y:b1y,w:bw2*fit,h:btnH*fit,action:'restart'},
    {x:b2x,y:b2y,w:bw2*fit,h:btnH*fit,action:'home'}
  ];
}

/* ============ Render ============ */
function render(){
  var sx=0,sy=0;
  if(shakeT>0){
    var m=shakeT/0.15*3;
    sx=(Math.random()-0.5)*2*m;sy=(Math.random()-0.5)*2*m;
  }
  ctx.save();
  ctx.translate(sx,sy);
  drawBackground();
  ctx.fillStyle='rgba(70,45,15,0.16)';
  ctx.beginPath();ctx.ellipse(basket.x,groundTop+7*K,basket.w*0.5,8*K,0,0,Math.PI*2);ctx.fill();
  for(var i=0;i<fruits.length;i++){
    var f=fruits[i];
    if(f.def.special==='gold')glow(f.x,f.y,30+Math.sin(time*6)*4,'rgba(255,205,80,0.20)');
    if(f.def.special==='star')glow(f.x,f.y,28+Math.sin(time*6)*3,'rgba(255,230,120,0.18)');
    if(f.def.special==='slow')glow(f.x,f.y,28+Math.sin(time*5)*3,'rgba(95,198,216,0.22)');
    if(f.def.special==='heart')glow(f.x,f.y,26+Math.sin(time*5)*3,'rgba(244,91,121,0.20)');
    drawFruitSprite(ctx,f);
  }
  drawBasket();
  drawEffects();
  ctx.restore();
  var vg=ctx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.5,W/2,H*0.55,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(90,50,10,0.10)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(missFlashT>0){
    var a=missFlashT/0.4*0.28;
    var gr2=ctx.createLinearGradient(0,H-90*K,0,H);
    gr2.addColorStop(0,'rgba(220,60,40,0)');gr2.addColorStop(1,'rgba(220,60,40,'+a.toFixed(3)+')');
    ctx.fillStyle=gr2;ctx.fillRect(0,H-90*K,W,90*K);
  }
  if(state==='home'){
    drawHomeUI();
    if(settingsOpen)drawSettingsPanel();
  }
  else if(state==='playing')drawHUD();
  else drawGameOver();
}

/* ============ Single game loop ============ */
function frame(t){
  requestAnimationFrame(frame);
  if(!lastT){lastT=t;}
  var dt=(t-lastT)/1000;lastT=t;
  if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  time+=dt;
  update(dt);
  render();
}

/* ============ Boot ============ */
try{
  best=parseInt(localStorage.getItem('fc_best')||'0',10)||0;
  settings.sound=localStorage.getItem('fc_sound')!=='0';
  settings.vibrate=localStorage.getItem('fc_vibrate')!=='0';
}catch(e){}
resize();
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120);});
resetWorld();
state='home';
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){
  try{
    document.fonts.load('700 20px Fredoka');
    document.fonts.load('600 20px Fredoka');
    document.fonts.load('500 20px Fredoka');
  }catch(e){}
}
})();
</script>
