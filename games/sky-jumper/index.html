<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sky Jumper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#9cc8e2}
  body{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;
       font-family:'Fredoka',ui-rounded,system-ui,sans-serif}
  #app{position:fixed;inset:0;touch-action:none;overflow:hidden}
  canvas{position:absolute;inset:0;display:block}
  .hidden{display:none!important}

  /* ---------- HUD ---------- */
  #hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;
       align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
       pointer-events:none;color:#1e3d55}
  .hlabel{display:block;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
          color:rgba(20,50,75,.65);text-shadow:0 1px 0 rgba(255,255,255,.45)}
  .hval{font-size:25px;font-weight:700;line-height:1.05;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  #hudRight{display:flex;align-items:flex-start;gap:12px}
  #hudBest{text-align:right}
  #pauseBtn{pointer-events:auto;width:40px;height:40px;border:none;border-radius:14px;cursor:pointer;
            background:rgba(255,255,255,.85);color:#2b5570;display:flex;align-items:center;justify-content:center;
            box-shadow:0 3px 10px rgba(30,60,90,.18)}
  #pauseBtn:active{transform:scale(.92)}

  /* ---------- HOME: preview upar, logo neeche ---------- */
  #home{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
        padding:calc(env(safe-area-inset-bottom,0px) + 20px) 22px}
  #home.fade{opacity:0;transition:opacity .28s ease}
  .hSpacer{flex:1}
  .logo{display:flex;flex-direction:column;align-items:center;transform:rotate(-2deg);margin-bottom:18px}
  .logoSky{font-size:clamp(46px,14vw,62px);font-weight:700;line-height:.9;color:#fff;letter-spacing:.08em;
           text-indent:.08em;
           text-shadow:0 3px 0 #2e6f9e,0 6px 0 rgba(46,111,158,.45),0 14px 26px rgba(25,70,110,.35)}
  .logoJumper{margin-top:9px;background:#ff5e52;color:#fff;font-weight:700;
              font-size:clamp(19px,5.6vw,25px);letter-spacing:.22em;text-indent:.22em;
              padding:7px 20px 9px;border-radius:16px;
              box-shadow:0 5px 0 #cf4038,0 12px 22px rgba(200,70,60,.32)}
  .hInfo{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
  .hDesc{font-size:clamp(12.5px,3.6vw,15px);font-weight:500;color:#f4fbff;max-width:280px;line-height:1.35;
         text-shadow:0 1px 10px rgba(25,70,110,.5)}
  .hCat{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#2b5570;
        background:rgba(255,255,255,.88);padding:5px 15px;border-radius:999px;
        box-shadow:0 2px 8px rgba(30,60,90,.15)}
  .hPlay{margin-top:clamp(12px,3.2vh,24px);display:flex;align-items:center;gap:8px;background:#fff;color:#ff5e52;
         font-weight:600;font-size:14px;letter-spacing:.05em;padding:12px 26px;border-radius:999px;
         box-shadow:0 6px 18px rgba(30,60,90,.22);animation:pulse 1.9s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  /* ---------- Sound button (home, top-right) ---------- */
  #sndBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;width:42px;height:42px;
          border:none;border-radius:14px;background:rgba(255,255,255,.88);color:#2b5570;cursor:pointer;
          display:flex;align-items:center;justify-content:center;z-index:2;
          box-shadow:0 3px 10px rgba(30,60,90,.18)}
  #sndBtn:active{transform:scale(.92)}

  /* ---------- OVERLAYS ---------- */
  .overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
           background:rgba(16,40,62,.5);padding:24px}
  .panel{width:min(320px,86vw);background:#fff;border-radius:26px;padding:26px 22px 22px;
         display:flex;flex-direction:column;align-items:center;
         box-shadow:0 22px 50px rgba(10,35,60,.35);animation:pop .32s cubic-bezier(.34,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.8);opacity:0}}
  .pTitle{font-size:23px;font-weight:600;color:#1e3d55;letter-spacing:.04em;margin-bottom:14px}
  .pScoreLabel{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8aa3b5}
  .pScore{font-size:48px;font-weight:700;color:#ff5e52;line-height:1.05}
  .pBestRow{margin-top:10px;font-size:13px;font-weight:600;color:#5c7d94;display:flex;gap:7px;align-items:baseline}
  .pBestRow b{font-size:17px;color:#2b5570}
  .btnRow{display:flex;gap:10px;width:100%;margin-top:20px}
  .btn{flex:1;height:48px;border:none;border-radius:15px;font-family:inherit;font-weight:600;font-size:15px;
       display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
  .btn:active{transform:scale(.96)}
  .btnGhost{background:#eef4f8;color:#2b5570}
  .btnSound{width:48px;height:48px;flex:none;border:none;border-radius:15px;background:#eef4f8;color:#2b5570;
            display:flex;align-items:center;justify-content:center;cursor:pointer}
  .btnSound:active{transform:scale(.94)}
  #btnResume{width:72px;height:72px;border-radius:50%;border:none;background:#ff5e52;color:#fff;cursor:pointer;
             display:flex;align-items:center;justify-content:center;margin:6px 0 18px;
             box-shadow:0 8px 20px rgba(255,94,82,.4)}
  #btnResume:active{transform:scale(.93)}

  @media (max-height:430px){
    .logoSky{font-size:34px}
    .logoJumper{font-size:16px;margin-top:6px;padding:5px 15px 7px}
    .hDesc{font-size:12px}
    .hPlay{padding:9px 20px;font-size:13px;margin-top:10px}
    .hInfo{gap:6px}
    .logo{margin-bottom:12px}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div><span class="hlabel">Score</span><span class="hval" id="scoreVal">0</span></div>
    <div id="hudRight">
      <div id="hudBest"><span class="hlabel">Best</span><span class="hval" id="bestVal">0</span></div>
      <button id="pauseBtn" aria-label="Pause">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.6z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <!-- HOME: live world preview upar → neeche logo / description / play -->
  <div id="home">
    <button id="sndBtn" aria-label="Sound"></button>
    <div class="hSpacer"></div>
    <div class="logo">
      <div class="logoSky">SKY</div>
      <div class="logoJumper">JUMPER</div>
    </div>
    <div class="hInfo">
      <div class="hDesc">Leap across floating isles and climb into the stars.</div>
      <div class="hCat">Arcade</div>
    </div>
    <div class="hPlay">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="3.1" fill="currentColor"/><path d="M12 4.5a7.5 7.5 0 0 1 7.5 7.5h-2A5.5 5.5 0 0 0 12 6.5zM12 1a11 11 0 0 1 11 11h-2a9 9 0 0 0-9-9z" fill="currentColor" opacity=".5"/></svg>
      Touch to Play
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pauseOv" class="overlay hidden">
    <div class="panel">
      <button id="btnResume" aria-label="Resume">
        <svg viewBox="0 0 24 24" width="30" height="30"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
      </button>
      <div class="btnRow">
        <button id="sndBtn2" class="btnSound" aria-label="Sound"></button>
        <button id="btnPauseHome" class="btn btnGhost">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 4l8 7h-2.4v8h-4.4v-5.4h-2.4V19H6.4v-8H4z" fill="currentColor"/></svg>
          Home
        </button>
      </div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="overOv" class="overlay hidden">
    <div class="panel">
      <div class="pTitle">Game Over</div>
      <div class="pScoreLabel">Score</div>
      <div class="pScore" id="oScore">0</div>
      <div class="pBestRow">Best <b id="oBest">0</b></div>
      <div class="btnRow">
        <button id="btnRestart" class="btn btnPrimary">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 5V2L7.5 6 12 10V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></svg>
          Restart
        </button>
        <button id="btnHome" class="btn btnGhost">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 4l8 7h-2.4v8h-4.4v-5.4h-2.4V19H6.4v-8H4z" fill="currentColor"/></svg>
          Home
        </button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
/* ============================== helpers ============================== */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
const rand  = (a,b) => a + Math.random() * (b - a);
const mkCanvas = (w,h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function dot(g,x,y,r){ g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); }
const mix = (c1,c2,t) => [0,1,2].map(i => Math.round(lerp(c1[i], c2[i], t)));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

/* ============================== DOM ============================== */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), app = $('app');
const els = { hud:$('hud'), score:$('scoreVal'), best:$('bestVal'), home:$('home'),
  pauseOv:$('pauseOv'), overOv:$('overOv'), pauseBtn:$('pauseBtn'), sndBtn:$('sndBtn'), sndBtn2:$('sndBtn2'),
  btnResume:$('btnResume'), btnPauseHome:$('btnPauseHome'),
  btnRestart:$('btnRestart'), btnHome:$('btnHome'), oScore:$('oScore'), oBest:$('oBest') };

/* ============================== AUDIO ENGINE ============================== */
const ICON_ON  = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M15.8 9.2a4 4 0 0 1 0 5.6M18.2 6.8a7.4 7.4 0 0 1 0 10.4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

const AU = {
  ctx:null, master:null, mus:null, sfxG:null, timer:null, step:0, nextT:0,
  on: true,
  CH: [[261.63,329.63,392.00],[220.00,261.63,329.63],[174.61,220.00,261.63],[196.00,246.94,293.66]],
  MEL: [523.25,0,659.25,0,783.99,0,659.25,0,880,0,783.99,0,659.25,0,523.25,0,
        587.33,0,659.25,0,783.99,0,880,0,1046.5,0,880,0,783.99,659.25,523.25,0],
  loadPref(){ try { this.on = localStorage.getItem('sj_snd') !== '0'; } catch(e){} },
  unlock(){
    if (!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.on ? 1 : 0;
      this.master.connect(this.ctx.destination);
      this.mus = this.ctx.createGain(); this.mus.gain.value = 0.5; this.mus.connect(this.master);
      this.sfxG = this.ctx.createGain(); this.sfxG.gain.value = 0.7; this.sfxG.connect(this.master);
      if (this.on) this.startMusic();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  startMusic(){
    if (!this.ctx || this.timer) return;
    this.step = 0; this.nextT = this.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.sched(), 80);
  },
  stopMusic(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } },
  sched(){
    const c = this.ctx;
    if (this.nextT < c.currentTime - 0.2) this.nextT = c.currentTime + 0.05;  // catch-up after tab hidden
    while (this.nextT < c.currentTime + 0.25){
      this.playStep(this.step, this.nextT);
      this.step++; this.nextT += 0.24;
    }
  },
  playStep(s, t){
    if (s % 8 === 0) this.pad(this.CH[(s / 8 | 0) % 4], t);
    const m = this.MEL[s % 32];
    if (m) this.pluck(m, t);
  },
  pad(fs, t){
    const c = this.ctx;
    for (const f of fs){
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.055, t + 0.5);
      g.gain.setValueAtTime(0.055, t + 1.4);
      g.gain.linearRampToValueAtTime(0.0001, t + 1.95);
      o.connect(g); g.connect(this.mus);
      o.start(t); o.stop(t + 2);
    }
  },
  pluck(f, t){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.14, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g); g.connect(this.mus);
    o.start(t); o.stop(t + 0.55);
  },
  tone(f0, f1, dur, type, vol, when){
    const c = this.ctx; if (!c) return;
    const t0 = when || c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.sfxG);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  sfx(n){
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime;
    if      (n === 'click')   this.tone(620, null, .07, 'square', .1);
    else if (n === 'jump')    this.tone(320, 640, .13, 'sine', .11);
    else if (n === 'bounce')  this.tone(300, 980, .18, 'triangle', .18);
    else if (n === 'cloud')   this.tone(620, 140, .22, 'sine', .13);
    else if (n === 'collect'){ this.tone(1046.5, null, .12, 'sine', .16);
                               this.tone(1568, null, .2, 'sine', .16, t + .08); }
    else if (n === 'die'){     this.tone(494, null, .15, 'triangle', .16);
                               this.tone(392, null, .15, 'triangle', .16, t + .14);
                               this.tone(261.63, null, .45, 'triangle', .18, t + .28); }
  },
  toggle(){
    this.on = !this.on;
    try { localStorage.setItem('sj_snd', this.on ? '1' : '0'); } catch(e){}
    if (this.on){
      this.unlock();
      if (this.master) this.master.gain.value = 1;
      if (this.ctx) this.startMusic();
    } else {
      this.stopMusic();
      if (this.master) this.master.gain.value = 0;
    }
    syncSoundIcons();
  }
};
AU.loadPref();
function syncSoundIcons(){
  const ic = AU.on ? ICON_ON : ICON_OFF;
  els.sndBtn.innerHTML = ic; els.sndBtn2.innerHTML = ic;
}

/* ============================== sizing ============================== */
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const REF_H = 700, SS = 2;
let W = 0, H = 0, S = 1, VIEW_W = 360;

function onResize(){
  W = window.innerWidth; H = window.innerHeight;
  S = H / REF_H; VIEW_W = W / S;
  cv.width  = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  if (state === ST.HOME && player){ player.x = VIEW_W / 2; platforms[0].x = platforms[0].baseX = VIEW_W / 2; }
  if (player) player.x = clamp(player.x, -PR, VIEW_W + PR);
}

/* ============================== state ============================== */
const ST = { HOME:0, PLAY:1, PAUSE:2, DYING:3, OVER:4 };
let state = ST.HOME;
let camY = -234, genY = 0, score = 0, bonus = 0, shownScore = -1, maxAlt = 130;
let best = 0; try { best = parseInt(localStorage.getItem('sj_best')) || 0; } catch(e){}
let flash = 0, dieT = 0, hzCool = 0, lastType = 'normal', tGlobal = 0;
let platforms = [], items = [], hazards = [], parts = [], player = null;
let targetVx = 0, dragActive = false, dragId = -1, dragX0 = 0;

const G = 1500, JV = 740, BV = 1180, MAXVX = 430, MAXFALL = -1350, PR = 20;
const diff = () => clamp(score / 900, 0, 1);

/* ============================== prerendered sprites ============================== */
function platSprite(type, w){
  const pad = 16, capH = 13, bodyH = 24;
  const c = mkCanvas((w + pad*2) * SS, (capH + bodyH + pad*2) * SS);
  const g = c.getContext('2d'); g.scale(SS, SS); g.translate(pad, pad);
  if (type !== 'cloud'){
    g.fillStyle = 'rgba(40,70,90,.16)';
    g.beginPath(); g.ellipse(w/2, capH + bodyH + 5, w * 0.42, 6, 0, 0, TAU); g.fill();
  }
  if (type === 'bounce'){
    const eg = g.createLinearGradient(0, 8, 0, 26);
    eg.addColorStop(0, '#C9995F'); eg.addColorStop(1, '#96683F');
    rr(g, 8, 8, w - 16, 18, 8); g.fillStyle = eg; g.fill();
    const pg = g.createLinearGradient(0, 0, 0, 15);
    pg.addColorStop(0, '#FFA5B1'); pg.addColorStop(1, '#EE6B84');
    rr(g, 2, 0, w - 4, 15, 8); g.fillStyle = pg; g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)';
    dot(g, w * 0.3, 5.5, 2.2); dot(g, w * 0.56, 8.5, 1.8); dot(g, w * 0.76, 4.5, 1.6);
    g.fillStyle = 'rgba(255,255,255,.4)'; rr(g, 6, 2, w - 12, 2.5, 1.2); g.fill();
  } else if (type === 'cloud'){
    g.fillStyle = 'rgba(255,255,255,.96)';
    rr(g, 6, 8, w - 12, 14, 9); g.fill();
    dot(g, w * 0.16, 12, 10); dot(g, w * 0.36, 7, 12); dot(g, w * 0.6, 9, 11); dot(g, w * 0.82, 14, 8);
    g.fillStyle = 'rgba(180,208,226,.6)'; rr(g, 10, 16, w - 20, 6, 3); g.fill();
  } else {
    const eg = g.createLinearGradient(0, capH, 0, capH + bodyH);
    eg.addColorStop(0, '#C9995F'); eg.addColorStop(1, '#96683F');
    rr(g, 4, capH - 3, w - 8, bodyH + 3, 11); g.fillStyle = eg; g.fill();
    g.fillStyle = 'rgba(90,55,30,.35)';
    dot(g, w * 0.3, capH + 11, 2); dot(g, w * 0.62, capH + 15, 1.6); dot(g, w * 0.45, capH + 8, 1.3);
    g.fillStyle = '#8A5C38';
    rr(g, w * 0.25 - 2.5, capH + bodyH - 2, 5, 6, 2.5); g.fill();
    rr(g, w * 0.68 - 2.5, capH + bodyH - 3, 5, 7, 2.5); g.fill();
    const gg = g.createLinearGradient(0, 0, 0, capH + 4);
    const mv = type === 'moving';
    gg.addColorStop(0, mv ? '#9BE4F2' : '#98DFA9');
    gg.addColorStop(1, mv ? '#4FA9C8' : '#55B17E');
    rr(g, 0, 0, w, capH + 4, 10); g.fillStyle = gg; g.fill();
    g.fillStyle = 'rgba(255,255,255,.35)'; rr(g, 3, 2, w - 6, 3, 1.5); g.fill();
    g.fillStyle = mv ? '#7FD2E6' : '#7CCB96';
    g.beginPath();
    [0.18, 0.4, 0.66, 0.85].forEach(f => { const x = w * f;
      g.moveTo(x - 3, 0); g.lineTo(x, -6); g.lineTo(x + 3, 0); });
    g.fill();
    if (mv){ g.strokeStyle = 'rgba(200,242,250,.9)'; g.lineWidth = 2;
      rr(g, 1, 1, w - 2, capH + 2, 9); g.stroke(); }
  }
  return { c, padTop: pad };
}
const PSPR = {};
const getPlatSpr = (type, w) => PSPR[type + w] || (PSPR[type + w] = platSprite(type, w));

function bgCloudSprite(w, h, puffs){
  const c = mkCanvas(w * SS, h * SS), g = c.getContext('2d'); g.scale(SS, SS);
  g.fillStyle = '#FFFFFF'; g.beginPath();
  puffs.forEach(p => { g.moveTo(p[0] + p[2], p[1]); g.arc(p[0], p[1], p[2], 0, TAU); });
  rr(g, w * 0.12, h * 0.42, w * 0.76, h * 0.34, h * 0.17); g.fill();
  g.fillStyle = 'rgba(190,215,232,.5)';
  g.beginPath(); g.ellipse(w / 2, h * 0.7, w * 0.34, h * 0.12, 0, 0, TAU); g.fill();
  return { c, w, h };
}
function isleSprite(){
  const w = 200, h = 90, c = mkCanvas(w * SS, h * SS), g = c.getContext('2d'); g.scale(SS, SS);
  g.fillStyle = '#A4BECB'; g.beginPath(); g.ellipse(100, 58, 86, 28, 0, 0, TAU); g.fill();
  g.fillStyle = '#B9D6C4'; g.beginPath(); g.ellipse(100, 44, 80, 17, 0, 0, TAU); g.fill();
  g.fillStyle = '#8FAF9F';
  g.beginPath(); g.moveTo(52, 36); g.lineTo(62, 12); g.lineTo(72, 36); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(136, 38); g.lineTo(144, 20); g.lineTo(152, 38); g.closePath(); g.fill();
  return { c, w, h };
}
function stormSprite(){
  const pad = 48, c = mkCanvas(pad * 2 * SS, pad * 2 * SS), g = c.getContext('2d');
  g.scale(SS, SS); g.translate(pad, pad);
  g.fillStyle = '#575169'; g.beginPath();
  [[0,-2,26],[-24,6,17],[24,6,17],[-12,-14,15],[13,-12,14]].forEach(p => {
    g.moveTo(p[0] + p[2], p[1]); g.arc(p[0], p[1], p[2], 0, TAU); });
  g.fill();
  g.fillStyle = '#453F58'; rr(g, -26, 8, 52, 10, 6); g.fill();
  g.strokeStyle = '#FFC46B'; g.lineWidth = 2.5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-14,-5); g.lineTo(-5,-2); g.moveTo(14,-5); g.lineTo(5,-2); g.stroke();
  return { c, size: pad * 2 };
}
function starSprite(){
  const s = 64, c = mkCanvas(s * SS, s * SS), g = c.getContext('2d');
  g.scale(SS, SS); g.translate(s / 2, s / 2);
  const rg = g.createRadialGradient(0, 0, 4, 0, 0, 30);
  rg.addColorStop(0, 'rgba(255,214,110,.55)'); rg.addColorStop(1, 'rgba(255,214,110,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(0, 0, 30, 0, TAU); g.fill();
  g.beginPath();
  for (let i = 0; i < 10; i++){
    const r = i % 2 ? 6.4 : 15, a = -Math.PI / 2 + i * Math.PI / 5;
    g[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
  }
  g.closePath();
  const sg = g.createLinearGradient(0, -15, 0, 15);
  sg.addColorStop(0, '#FFE082'); sg.addColorStop(1, '#FFB53E');
  g.fillStyle = sg; g.fill();
  g.strokeStyle = 'rgba(200,130,30,.5)'; g.lineWidth = 1.2; g.stroke();
  g.fillStyle = 'rgba(255,255,255,.85)'; dot(g, -4, -5, 2);
  return { c, size: s / SS };
}
function sunSprite(){
  const s = 256, c = mkCanvas(s, s), g = c.getContext('2d');
  const rg = g.createRadialGradient(s/2, s/2, 8, s/2, s/2, s/2);
  rg.addColorStop(0, 'rgba(255,248,225,1)'); rg.addColorStop(0.25, 'rgba(255,240,200,.9)');
  rg.addColorStop(0.6, 'rgba(255,236,190,.25)'); rg.addColorStop(1, 'rgba(255,236,190,0)');
  g.fillStyle = rg; g.fillRect(0, 0, s, s);
  return { c, size: s };
}
const CLOUD_FAR  = bgCloudSprite(190, 90, [[50,38,22],[95,28,28],[140,40,20]]);
const CLOUD_MID  = bgCloudSprite(150, 70, [[45,30,18],[85,22,22],[118,32,15]]);
const CLOUD_NEAR = bgCloudSprite(240,100, [[70,44,26],[120,32,30],[170,44,24]]);
const ISLE = isleSprite();
const STORM = stormSprite();
const STAR = starSprite();
const SUN  = sunSprite();

let farL, midL, nearL, isleL;
function mkLayer(n, f, sprs, alpha, sizeMul){
  const arr = [];
  for (let i = 0; i < n; i++) arr.push({
    x: rand(-30, VIEW_W + 30), y: camY * f + rand(-100, REF_H + 140),
    s: rand(0.75, 1.3) * sizeMul, vx: rand(4, 9) * (Math.random() < 0.5 ? -1 : 1),
    spr: sprs[(Math.random() * sprs.length) | 0], a: alpha * rand(0.8, 1) });
  return { arr, f };
}
function initClouds(){
  farL  = mkLayer(5, 0.32, [CLOUD_FAR],  0.6, 0.9);
  midL  = mkLayer(4, 0.58, [CLOUD_MID],  0.9, 1.1);
  nearL = mkLayer(2, 1.15, [CLOUD_NEAR], 0.32, 1.4);
  isleL = mkLayer(3, 0.15, [ISLE],       0.5, 1.6);
}
const bgStars = [];
for (let i = 0; i < 46; i++) bgStars.push({
  x: Math.random(), y: rand(0, REF_H), a: rand(0.4, 1), tw: rand(1, 3), ph: rand(0, TAU) });

/* ============================== world ============================== */
function spawnPlatform(y){
  const d = diff();
  let type = 'normal'; const r = Math.random();
  const pB = 0.09, pC = 0.05 + 0.17 * d, pM = 0.14 + 0.26 * d;
  if (r < pB) type = 'bounce'; else if (r < pB + pC) type = 'cloud'; else if (r < pB + pC + pM) type = 'moving';
  if (type === 'cloud' && lastType === 'cloud') type = 'normal';
  const w = type === 'bounce' ? 58 : type === 'cloud' ? 66 : type === 'moving' ? 74 : 84;
  let amp = 0, baseX;
  if (type === 'moving'){
    amp = rand(26, 46 + 44 * d);
    if (w / 2 + amp + 12 > VIEW_W - w / 2 - amp - 12) amp = Math.max(12, (VIEW_W - w - 30) / 2);
    baseX = rand(w / 2 + amp + 10, Math.max(w / 2 + amp + 11, VIEW_W - w / 2 - amp - 10));
  } else baseX = rand(w / 2 + 12, VIEW_W - w / 2 - 12);
  platforms.push({ x: baseX, baseX, y, w, type, amp, spd: rand(0.9, 1.5) * (0.8 + 0.6 * d),
    ph: rand(0, TAU), spr: getPlatSpr(type, w), ft: -1 });
  lastType = type;
  if (Math.random() < 0.34)
    items.push({ x: clamp(baseX + rand(-46, 46), 20, VIEW_W - 20), y: y + rand(70, 110), ph: rand(0, TAU) });
  if (y > 1300){
    const d2 = clamp((y - 1300) / 3600, 0, 1);
    if (hzCool <= 0 && Math.random() < lerp(0.10, 0.38, d2)){
      const hr = 32;
      hazards.push({ x: VIEW_W / 2, x0: VIEW_W / 2, y: y + rand(10, 50), r: hr,
        amp: rand(30, Math.max(36, VIEW_W / 2 - hr - 18)), spd: lerp(0.7, 1.5, d2),
        ph: rand(0, TAU), lt: rand(1, 3), fl: 0 });
      hzCool = 2;
    } else hzCool--;
  }
}
function genUp(){
  while (genY < camY + REF_H + 320){
    let gap;
    if (genY < 520) gap = rand(66, 100);
    else { const a = lerp(64, 106, diff()), b = lerp(92, 146, diff()); gap = rand(a, b); }
    genY += gap;
    spawnPlatform(genY);
  }
}
function initWorld(){
  camY = -234; score = 0; bonus = 0; shownScore = -1; maxAlt = 130;
  flash = 0; hzCool = 0; lastType = 'normal'; dieT = 0;
  platforms = []; items = []; hazards = []; parts = [];
  const w = 150;
  platforms.push({ x: VIEW_W / 2, baseX: VIEW_W / 2, y: 70, w, type: 'base',
    amp: 0, spd: 0, ph: 0, spr: getPlatSpr('base', w), ft: -1 });
  player = { x: VIEW_W / 2, y: 130, vx: 0, vy: 0, rot: 0, face: 1, sqv: 1,
    landT: 0, blinkT: 2, eyeOpen: 1, dead: false };
  genY = 150;
  genUp();
  initClouds();
}

/* ============================== particles ============================== */
function burst(x, y, n, col, up){
  for (let i = 0; i < n; i++) parts.push({
    x: x + rand(-8, 8), y: y + rand(-3, 3),
    vx: rand(-80, 80), vy: up ? rand(60, 190) : rand(30, 130),
    g: 260, life: rand(0.35, 0.6), max: 0.6, size: rand(2.5, 4.5), col });
  if (parts.length > 140) parts.splice(0, parts.length - 140);
}

/* ============================== gameplay ============================== */
const wy2s = y => H - (y - camY) * S;

function stepPlayer(dt, collide){
  const p = player, prevY = p.y;
  p.vy -= G * dt; if (p.vy < MAXFALL) p.vy = MAXFALL;
  p.y += p.vy * dt; p.x += p.vx * dt;
  if (p.x < -PR) p.x = VIEW_W + PR; else if (p.x > VIEW_W + PR) p.x = -PR;
  if (collide && p.vy <= 0){
    const f0 = prevY - PR * 0.9, f1 = p.y - PR * 0.9;
    for (const pl of platforms){
      if (pl.ft >= 0) continue;
      if (f0 >= pl.y && f1 <= pl.y && Math.abs(p.x - pl.x) <= pl.w / 2 + PR * 0.55){ land(pl); break; }
    }
  }
}
function land(pl){
  const p = player;
  p.y = pl.y + PR * 0.9; p.landT = 0.16;
  if (pl.type === 'bounce'){ p.vy = BV; burst(pl.x, pl.y, 6, '#ffd1da', true); AU.sfx('bounce'); }
  else if (pl.type === 'cloud'){ p.vy = JV; pl.ft = 0; burst(pl.x, pl.y, 7, 'rgba(255,255,255,.95)', true); AU.sfx('cloud'); }
  else { p.vy = state === ST.HOME ? JV * 0.55 : JV; if (state !== ST.HOME) AU.sfx('jump'); }
  if (state !== ST.HOME) burst(p.x, pl.y, 4, 'rgba(255,255,255,.9)', false);
}
function animatePlayer(dt){
  const p = player;
  p.landT = Math.max(0, p.landT - dt);
  const targ = p.landT > 0 ? lerp(0.7, 1, 1 - p.landT / 0.16)
                           : clamp(1 + Math.abs(p.vy) * 0.00022, 1, 1.16);
  p.sqv += (targ - p.sqv) * Math.min(1, dt * 16);
  p.blinkT -= dt; if (p.blinkT < -0.12) p.blinkT = rand(2.2, 4.5);
  p.eyeOpen = p.blinkT < 0 ? 0.15 : 1;
  if (Math.abs(p.vx) > 30) p.face = p.vx > 0 ? 1 : -1;
}
function updatePlats(dt){
  for (const pl of platforms){
    if (pl.type === 'moving') pl.x = pl.baseX + Math.sin(tGlobal * pl.spd + pl.ph) * pl.amp;
    if (pl.ft >= 0) pl.ft += dt;
  }
  platforms = platforms.filter(pl => pl.y > camY - 160 && !(pl.ft >= 0 && pl.ft > 0.35));
}
function updateHaz(dt){
  for (const h of hazards){
    h.x = h.x0 + Math.sin(tGlobal * h.spd + h.ph) * h.amp;
    h.lt -= dt; if (h.lt < 0){ h.fl = 0.16; h.lt = rand(1.4, 3.4); }
    h.fl = Math.max(0, h.fl - dt);
  }
}
function collect(){
  for (const it of items){
    if (it.got) continue;
    const iy = it.y + Math.sin(tGlobal * 2 + it.ph) * 6;
    const dx = player.x - it.x, dy = player.y - iy;
    if (dx * dx + dy * dy < (PR + 16) * (PR + 16)){
      it.got = true; bonus += 25; burst(it.x, iy, 9, '#FFCF5C', true); AU.sfx('collect');
    }
  }
}
function die(hz){
  if (state !== ST.PLAY) return;
  state = ST.DYING; dieT = 0; player.dead = true;
  if (hz) flash = 1;
  AU.sfx('die');
}
function cleanup(){
  items = items.filter(it => !it.got && it.y > camY - 140);
  hazards = hazards.filter(h => h.y > camY - 180);
}
function updateAmbient(dt){
  const tick = L => { for (const c of L.arr){
    c.x += c.vx * dt;
    if (c.x < -60) c.x = VIEW_W + 50; else if (c.x > VIEW_W + 60) c.x = -50;
    if (c.y - camY * L.f < -140){ c.y = camY * L.f + REF_H + rand(30, 180); c.x = rand(-30, VIEW_W + 30); }
  }};
  tick(farL); tick(midL); tick(nearL); tick(isleL);
  for (const p of parts){ p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  flash = Math.max(0, flash - dt * 2);
}

function updatePlay(dt){
  tGlobal += dt;
  animatePlayer(dt);
  player.vx += (targetVx - player.vx) * Math.min(1, dt * 14);
  stepPlayer(dt, true);
  const targ = player.y - REF_H * 0.45;
  if (targ > camY) camY += (targ - camY) * Math.min(1, dt * 10);
  if (player.y - camY > REF_H * 0.92) camY = player.y - REF_H * 0.92;
  maxAlt = Math.max(maxAlt, player.y);
  score = Math.floor((maxAlt - 130) / 8) + bonus;
  genUp(); updatePlats(dt); updateHaz(dt); collect(); cleanup();
  for (const h of hazards){
    const dx = player.x - h.x, dy = player.y - (h.y + 2);
    if (dx * dx + dy * dy < (PR + 20) * (PR + 20)){ die(true); return; }
  }
  if (player.y < camY - 70){ die(false); return; }
  if (shownScore !== score){ shownScore = score; els.score.textContent = score; }
}
function updateHome(dt){
  tGlobal += dt;
  animatePlayer(dt);
  player.vx += (0 - player.vx) * Math.min(1, dt * 6);
  stepPlayer(dt, true);
  updatePlats(dt);
}
function updateDying(dt){
  tGlobal += dt;
  player.vy -= G * dt; player.y += player.vy * dt; player.rot += 8 * dt;
  dieT += dt;
  if (dieT > 0.9) showOver();
}

/* ============================== rendering ============================== */
function drawSky(){
  const t = clamp(camY / 5200, 0, 1);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,    rgb(mix([86,160,208],  [26,52,94],   t)));
  g.addColorStop(0.55, rgb(mix([168,216,236],[74,118,164],  t)));
  g.addColorStop(1,    rgb(mix([250,240,216],[152,192,222], t)));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const sa = clamp((camY - 3200) / 1800, 0, 1);
  if (sa > 0){
    ctx.fillStyle = '#fff';
    for (const st of bgStars){
      const yy = ((st.y - camY * 0.15) % REF_H + REF_H) % REF_H * S;
      ctx.globalAlpha = sa * st.a * (0.55 + 0.45 * Math.sin(tGlobal * st.tw + st.ph));
      ctx.fillRect(st.x * W, yy, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  const sunA = 1 - clamp((camY - 1900) / 1400, 0, 1) * 0.75;
  if (sunA > 0.05){
    ctx.globalAlpha = sunA;
    const d = 260 * S, sx = W * 0.76, sy = H * 0.18 + camY * 0.05 * S;
    ctx.drawImage(SUN.c, sx - d / 2, sy - d / 2, d, d);
    ctx.globalAlpha = 1;
  }
}
function drawLayer(L){
  for (const c of L.arr){
    const sy = H - (c.y - camY * L.f) * S;
    if (sy < -180 * S || sy > H + 180 * S) continue;
    const dw = c.spr.w * S * c.s, dh = c.spr.h * S * c.s;
    ctx.globalAlpha = c.a;
    ctx.drawImage(c.spr.c, c.x * S - dw / 2, sy - dh / 2, dw, dh);
  }
  ctx.globalAlpha = 1;
}
const vis = y => y > camY - 160 && y < camY + REF_H + 180;
function drawPlat(pl){
  const spr = pl.spr, dw = spr.c.width / SS * S, dh = spr.c.height / SS * S;
  ctx.globalAlpha = pl.ft >= 0 ? Math.max(0, 1 - pl.ft / 0.35) * (pl.type === 'cloud' ? 0.95 : 1)
                               : (pl.type === 'cloud' ? 0.95 : 1);
  const yOff = pl.type === 'cloud' ? 10 : 0;
  ctx.drawImage(spr.c, pl.x * S - dw / 2, wy2s(pl.y) + yOff * S - spr.padTop * S, dw, dh);
  ctx.globalAlpha = 1;
}
function drawItem(it){
  const yy = it.y + Math.sin(tGlobal * 2 + it.ph) * 6;
  const sc = (1 + 0.08 * Math.sin(tGlobal * 3 + it.ph)) * S, d = 34 * sc;
  ctx.save();
  ctx.translate(it.x * S, wy2s(yy));
  ctx.rotate(Math.sin(tGlobal * 1.2 + it.ph) * 0.25);
  ctx.drawImage(STAR.c, -d / 2, -d / 2, d, d);
  ctx.restore();
}
function drawHaz(h){
  const d = STORM.size * S;
  ctx.drawImage(STORM.c, h.x * S - d / 2, wy2s(h.y) - d / 2, d, d);
  if (h.fl > 0){
    ctx.globalAlpha = h.fl / 0.16;
    ctx.strokeStyle = '#FFE9A0'; ctx.lineWidth = 3 * S; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo((h.x - 5) * S, wy2s(h.y - 22));
    ctx.lineTo((h.x - 13) * S, wy2s(h.y - 40));
    ctx.lineTo((h.x - 1) * S, wy2s(h.y - 44));
    ctx.lineTo((h.x - 9) * S, wy2s(h.y - 62));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}
function wing(sx, ang, col, len){
  ctx.save(); ctx.translate(sx, -22); ctx.scale(sx < 0 ? 1 : -1, 1); ctx.rotate(ang);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-len * 0.4, -len * 0.75, -len * 1.15, -len * 0.35);
  ctx.quadraticCurveTo(-len * 0.55, len * 0.15, 0, 0); ctx.fill(); ctx.restore();
}
function drawPlayer(){
  const p = player;
  if (p.y < camY - 80 || p.y > camY + REF_H + 120) return;
  ctx.save();
  ctx.translate(p.x * S, wy2s(p.y));
  ctx.scale(S * p.face * (2 - p.sqv), S * p.sqv);
  if (p.dead) ctx.rotate(p.rot);
  const t = tGlobal;
  const fl = p.vy > 60 ? Math.sin(t * 26) * 0.5 - 0.5
           : p.vy < -60 ? -1.1 + Math.sin(t * 10) * 0.1
           : Math.sin(t * 4) * 0.15 - 0.3;
  ctx.lineCap = 'round';
  for (let i = 0; i < 2; i++){
    const wv = Math.sin(t * 7 + i * 2.1) * 4;
    const wob = clamp(-p.vy * 0.014, -7, 9);
    ctx.strokeStyle = i ? '#E85548' : '#FF6B5E'; ctx.lineWidth = i ? 3.5 : 5;
    ctx.beginPath(); ctx.moveTo(-2, -12);
    ctx.quadraticCurveTo(-12 - i * 4, -12 + wv, -16 - i * 9, -13 + wv * 1.5 + wob);
    ctx.stroke();
  }
  ctx.fillStyle = '#FF6B5E'; dot(ctx, 0, -11, 3);
  wing(-13, -fl * 0.6 - 0.2, '#E9B57F', 13);
  const bg = ctx.createRadialGradient(-5, -27, 4, 0, -21, 22);
  bg.addColorStop(0, '#FFF9EC'); bg.addColorStop(0.65, '#FFEFD2'); bg.addColorStop(1, '#FFD9A4');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, -21, 19, 18, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,247,230,.85)';
  ctx.beginPath(); ctx.ellipse(3, -13, 10.5, 8.5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#F5A05A';
  ctx.beginPath(); ctx.ellipse(-6.5, -1.5, 5, 3, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6.5, -1.5, 5, 3, 0, 0, TAU); ctx.fill();
  wing(13, fl + 0.25, '#F7C98F', 14);
  const eo = p.eyeOpen;
  ctx.fillStyle = '#3A2E2A';
  ctx.beginPath(); ctx.ellipse(5.5, -25, 3, 3.4 * eo, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14.5, -23.5, 2.8, 3.2 * eo, 0, 0, TAU); ctx.fill();
  if (eo > 0.5){
    ctx.fillStyle = '#fff'; dot(ctx, 4.6, -26.2, 1.1); dot(ctx, 13.7, -24.7, 1);
  }
  ctx.fillStyle = 'rgba(255,150,130,.5)';
  ctx.beginPath(); ctx.ellipse(9.5, -18.5, 3.2, 2, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#FF9F4A';
  ctx.beginPath(); ctx.moveTo(16.5, -23); ctx.lineTo(22.5, -21);
  ctx.lineTo(16.5, -19); ctx.lineTo(15.8, -21); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4E9BAA';
  ctx.beginPath(); ctx.moveTo(-16, -31);
  ctx.quadraticCurveTo(-14, -45, 0, -46); ctx.quadraticCurveTo(15, -45, 16, -30);
  ctx.quadraticCurveTo(0, -38, -16, -31); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3B7E8E'; rr(ctx, -17, -33.5, 34, 5, 2.5); ctx.fill();
  ctx.strokeStyle = '#33646F'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-14, -36); ctx.quadraticCurveTo(0, -42, 14, -37); ctx.stroke();
  const lens = (x, y) => {
    ctx.fillStyle = '#D9A44C'; dot(ctx, x, y, 4.6);
    ctx.fillStyle = '#CDEEF7'; dot(ctx, x, y, 3.3);
    ctx.fillStyle = '#fff'; dot(ctx, x - 1, y - 1, 1);
  };
  lens(-3, -42.5); lens(8, -41.5);
  ctx.restore();
}
function drawParts(){
  for (const p of parts){
    const a = p.life / p.max;
    ctx.globalAlpha = a; ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x * S, wy2s(p.y), p.size * S * (0.5 + 0.5 * a), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky();
  drawLayer(isleL); drawLayer(farL); drawLayer(midL);
  for (const pl of platforms) if (vis(pl.y)) drawPlat(pl);
  for (const it of items) if (vis(it.y)) drawItem(it);
  for (const h of hazards) if (vis(h.y)) drawHaz(h);
  drawPlayer();
  drawParts();
  drawLayer(nearL);
  if (flash > 0){ ctx.fillStyle = `rgba(255,90,70,${flash * 0.32})`; ctx.fillRect(0, 0, W, H); }
}

/* ============================== flow ============================== */
function startGame(reinit){
  els.pauseOv.classList.add('hidden'); els.overOv.classList.add('hidden');
  if (reinit || state !== ST.HOME) initWorld();
  state = ST.PLAY;
  targetVx = 0; dragActive = false;
  els.score.textContent = '0'; els.best.textContent = best;
  els.hud.classList.remove('hidden');
  els.home.classList.add('fade');
  setTimeout(() => { if (state !== ST.HOME){ els.home.classList.add('hidden'); els.home.classList.remove('fade'); } }, 300);
}
function goHome(){
  els.pauseOv.classList.add('hidden'); els.overOv.classList.add('hidden');
  els.hud.classList.add('hidden');
  initWorld();
  state = ST.HOME;
  els.home.classList.remove('hidden'); els.home.classList.remove('fade');
}
function pauseGame(){ if (state !== ST.PLAY) return; state = ST.PAUSE; els.pauseOv.classList.remove('hidden'); }
function resumeGame(){ if (state !== ST.PAUSE) return; els.pauseOv.classList.add('hidden'); state = ST.PLAY; }
function showOver(){
  state = ST.OVER;
  if (score > best){ best = score; try { localStorage.setItem('sj_best', best); } catch(e){} }
  els.oScore.textContent = score; els.oBest.textContent = best; els.best.textContent = best;
  els.hud.classList.add('hidden');
  els.overOv.classList.remove('hidden');
}

/* ============================== input (bound once) ============================== */
function onDown(e){
  AU.unlock();                                   // pehli touch par audio ready
  if (state === ST.HOME) startGame(false);
  if (state !== ST.PLAY) return;
  dragId = e.pointerId; dragX0 = e.clientX; dragActive = true;
}
function onMove(e){
  if (!dragActive || e.pointerId !== dragId || state !== ST.PLAY) return;
  targetVx = clamp((e.clientX - dragX0) / S * 8.5, -MAXVX, MAXVX);
}
function onUp(e){
  if (dragActive && e.pointerId === dragId){ dragActive = false; targetVx = 0; }
}
function bind(){
  app.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  document.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  /* har button click par sound — delegated, ek hi listener */
  document.addEventListener('click', e => { if (e.target.closest('button')) AU.sfx('click'); });
  /* sound buttons: home start ko trigger na karein */
  els.sndBtn.addEventListener('pointerdown', e => e.stopPropagation());
  els.sndBtn.addEventListener('click', e => { e.stopPropagation(); AU.toggle(); });
  els.sndBtn2.addEventListener('click', () => AU.toggle());
  els.pauseBtn.addEventListener('click', pauseGame);
  els.btnResume.addEventListener('click', resumeGame);
  els.btnPauseHome.addEventListener('click', goHome);
  els.btnRestart.addEventListener('click', () => startGame(true));
  els.btnHome.addEventListener('click', goHome);
  window.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) pauseGame(); });
}

/* ============================== single game loop ============================== */
let last = performance.now();
function frame(now){
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  if (state === ST.PLAY)       updatePlay(dt);
  else if (state === ST.HOME)  updateHome(dt);
  else if (state === ST.DYING) updateDying(dt);
  if (state !== ST.PAUSE) updateAmbient(dt);
  render();
  requestAnimationFrame(frame);
}

/* ============================== boot ============================== */
onResize();
bind();
initWorld();
els.best.textContent = best;
syncSoundIcons();
requestAnimationFrame(frame);
})();
</script>
