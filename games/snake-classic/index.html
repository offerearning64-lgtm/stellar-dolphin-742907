<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B100C">
<title>Snake Classic</title>
<style>
:root{
  --bg:#0B100C; --ink:#EDEBDD; --sub:#8FA38F;
  --acc:#CDEF4F; --accInk:#15230B; --red:#FF5348;
  --line:rgba(237,235,221,.1);
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;color:var(--ink);
  background:radial-gradient(120% 90% at 50% 30%,#101810 0%,#0B100C 55%,#070A07 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  user-select:none;-webkit-user-select:none}

.screen{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .3s ease}
.screen.active{opacity:1;pointer-events:auto}

/* ============ HOME ============ */
#home{cursor:pointer}
#ambient{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.homeUi{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:max(18px,env(safe-area-inset-top)) 22px max(18px,env(safe-area-inset-bottom));
  pointer-events:none;text-align:center}
.homeUi>*{pointer-events:auto}

/* top bar: BEST left · APPLES right */
.topBar{width:100%;display:flex;justify-content:space-between;align-items:flex-start}
.tstat{text-align:left}
.tstat.right{text-align:right}
.tstat .lbl{display:block;font-size:9px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--sub)}
.tstat b{display:block;margin-top:3px;font:800 22px/1 var(--mono);font-variant-numeric:tabular-nums}

.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.overline{font-size:11px;font-weight:700;letter-spacing:.42em;text-transform:uppercase;color:var(--sub)}
.overline i{font-style:normal;color:var(--acc);padding:0 .35em}
h1{font-size:clamp(58px,18vw,100px);font-weight:800;letter-spacing:-.035em;line-height:.92;
  text-shadow:0 4px 40px rgba(11,16,12,.85)}
.sub{font-size:clamp(12px,3.4vw,15px);font-weight:700;letter-spacing:.62em;text-transform:uppercase;
  color:var(--acc);margin-left:.62em}

/* dock: raised circular play button */
.dock{display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:7vh}
.playCircle{position:relative;width:92px;height:92px;border-radius:999px;border:none;background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.playCircle:active{transform:scale(.9)}
.playCircle .ring{position:absolute;inset:0;border-radius:999px;
  border:1.5px solid rgba(237,235,221,.18);
  background:rgba(237,235,221,.04);backdrop-filter:blur(6px)}
.playCircle::after{content:'';position:absolute;inset:-9px;border-radius:999px;
  border:1px solid rgba(205,239,79,.28);animation:halo 2.8s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.94);opacity:.35}50%{transform:scale(1.04);opacity:.9}}
.playCircle svg{position:relative;color:var(--acc);margin-left:4px}
.playLabel{font-size:10px;font-weight:700;letter-spacing:.4em;text-transform:uppercase;color:var(--sub);margin-left:.4em}

@media (orientation:landscape) and (max-height:520px){
  .homeUi{flex-direction:row;justify-content:space-between;text-align:left;gap:24px;padding:24px max(40px,env(safe-area-inset-right))}
  .topBar{width:auto;order:3}
  .hero{align-items:flex-start;order:1}
  .dock{order:2;align-self:center;padding-bottom:0}
}

/* ============ GAME ============ */
#game{display:flex;flex-direction:column}
#hud{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;gap:8px;width:100%;
  padding:calc(10px + env(safe-area-inset-top)) 18px 4px}
#pauseBtn{width:48px;height:48px;min-width:48px;justify-self:start;background:transparent;border:none;color:var(--sub)}
#pauseBtn:active{color:var(--ink);transform:scale(.9)}
.scoreBox{text-align:center}
.lbl{display:block;font-size:9px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--sub)}
#score{display:block;font:800 34px/1.05 var(--mono);font-variant-numeric:tabular-nums}
.bestBox{text-align:right;justify-self:end}
#best{display:block;font:700 16px/1.2 var(--mono);color:var(--acc);font-variant-numeric:tabular-nums}
#stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;
  margin:4px;margin-bottom:max(12px,env(safe-area-inset-bottom));touch-action:none}
canvas{display:block;touch-action:none}

#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5;
  font:800 clamp(58px,18vmin,88px) var(--mono);color:var(--acc);text-shadow:0 8px 40px rgba(0,0,0,.6)}
#count.hidden{display:none}
#count.pop{animation:pop .42s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}

#toast{position:absolute;top:14px;left:50%;transform:translate(-50%,-8px);z-index:6;pointer-events:none;
  font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--acc);
  padding:9px 18px;border-radius:999px;background:rgba(11,16,12,.85);border:1px solid rgba(205,239,79,.25);
  opacity:0;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}

.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(9,13,10,.92);opacity:1;transition:opacity .22s}
.overlay.hidden{opacity:0;pointer-events:none}
.sheet{width:min(84vw,320px);display:flex;flex-direction:column;align-items:center;gap:0;
  transition:transform .28s cubic-bezier(.2,1.2,.4,1)}
.overlay.hidden .sheet{transform:translateY(14px)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.4em;text-transform:uppercase;color:var(--sub);margin-left:.4em}
.kicker.dead{color:var(--red)}
.bigScore{font:800 clamp(60px,20vmin,84px)/1.1 var(--mono);font-variant-numeric:tabular-nums;margin:8px 0 2px}
.bestLine{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--sub);margin-bottom:30px}
.bestLine b{color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums}
.badge{background:var(--acc);color:var(--accInk);font-size:9px;font-weight:800;letter-spacing:.16em;
  padding:4px 10px;border-radius:999px}
.badge.hidden{display:none}
.sheet .btn{width:100%}
.btn{border:none;border-radius:999px;height:56px;font-family:inherit;font-weight:800;font-size:13px;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:9px;transition:transform .12s;color:var(--ink)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--acc);color:var(--accInk)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn+.btn{margin-top:10px}
.btnRow{display:flex;gap:10px;width:100%}
.btnRow .btn{flex:1;height:48px;font-size:11px;margin-top:0}
.btnRow+.btn{margin-top:10px}
.gapTop{margin-top:30px}

body.muted .ico-wave{display:none}
body:not(.muted) .ico-slash{display:none}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<section id="home" class="screen active">
  <canvas id="ambient" aria-hidden="true"></canvas>
  <div class="homeUi">
    <div class="topBar">
      <div class="tstat"><span class="lbl">Best</span><b id="homeBest">0</b></div>
      <div class="tstat right"><span class="lbl">Apples</span><b id="homeApples">0</b></div>
    </div>
    <div class="hero">
      <p class="overline">Action<i>·</i>Arcade</p>
      <h1>Snake</h1>
      <p class="sub">Classic</p>
    </div>
    <div class="dock">
      <button class="playCircle" id="playBtn" aria-label="Play">
        <span class="ring"></span>
        <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
      </button>
      <p class="playLabel">Play</p>
    </div>
  </div>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen">
  <header id="hud">
    <button class="iconBtn" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1.6"/><rect x="14" y="5" width="4" height="14" rx="1.6"/>
      </svg>
    </button>
    <div class="scoreBox"><span class="lbl">Score</span><b id="score">0</b></div>
    <div class="bestBox"><span class="lbl">Best</span><b id="best">0</b></div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
    <div id="count" class="hidden"></div>

    <div id="pausePanel" class="overlay hidden">
      <div class="sheet">
        <p class="kicker">Paused</p>
        <button class="btn primary gapTop" id="resumeBtn">Resume</button>
        <div class="btnRow">
          <button class="btn ghost" id="pRestartBtn">Restart</button>
          <button class="btn ghost" id="pHomeBtn">Home</button>
        </div>
        <button class="btn ghost" id="pauseSound">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/>
            <path class="ico-wave" d="M15.5 8.5a5 5 0 0 1 0 7"/>
            <path class="ico-wave" d="M18.5 6a9 9 0 0 1 0 12"/>
            <path class="ico-slash" d="M16 9l6 6M22 9l-6 6"/>
          </svg>
          Sound
        </button>
      </div>
    </div>

    <div id="overPanel" class="overlay hidden">
      <div class="sheet">
        <p class="kicker dead" id="overTitle">Game Over</p>
        <div class="bigScore" id="finalScore">0</div>
        <div class="bestLine"><span>Best <b id="overBest">0</b></span><span id="newBest" class="badge hidden">New best</span></div>
        <button class="btn primary" id="againBtn">Play Again</button>
        <button class="btn ghost" id="oHomeBtn">Home</button>
      </div>
    </div>
  </div>
</section>

<noscript><p style="padding:24px">Snake Classic needs JavaScript to run.</p></noscript>

<script>
(()=>{ 'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const MONO='ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace';
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ================= audio (procedural, no assets) ================= */
const Sfx={
  muted:!!store.get('sc_muted',false), ctx:null,
  ac(){ if(this.muted)return null;
    try{
      if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;this.ctx=new A()}
      if(this.ctx.state==='suspended')this.ctx.resume();
      return this.ctx;
    }catch(e){return null} },
  tone(f,dur,type,vol,delay,slide){
    const c=this.ac(); if(!c)return;
    try{
      const t=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
      o.type=type||'triangle'; o.frequency.setValueAtTime(f,t);
      if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.06);
    }catch(e){}
  },
  eat(n){this.tone(400*Math.pow(2,Math.min(n,14)/14),0.12,'triangle',0.18)},
  click(){this.tone(640,0.05,'triangle',0.07)},
  go(){this.tone(880,0.12,'triangle',0.12)},
  milestone(){this.tone(523,0.09,'triangle',0.13);this.tone(784,0.16,'triangle',0.13,0.09)},
  die(){this.tone(280,0.35,'sawtooth',0.12,0,-180);this.tone(140,0.5,'square',0.07,0.06,-80)}
};

/* ================= shared snake renderer ================= */
function strokePath(g,pts,a,b,w){
  if(b-a<0.5)return;
  g.lineWidth=w; g.beginPath();
  g.moveTo(pts[a].x,pts[a].y);
  for(let i=a+1;i<=b;i++)g.lineTo(pts[i].x,pts[i].y);
  g.stroke();
}
function strokeSeg(g,p,q,w){
  g.lineWidth=w; g.beginPath();
  g.moveTo(p.x,p.y); g.lineTo(q.x,q.y); g.stroke();
}
function renderSnakeBody(g,pts,cell,opts){
  opts=opts||{};
  const n=pts.length; if(!n)return;
  const bw=cell*0.72, K=Math.min(6,n-1), be=n-1-K;
  g.save();
  if(opts.alpha!=null)g.globalAlpha=opts.alpha;
  g.lineCap='round'; g.lineJoin='round';
  g.save(); g.translate(0,Math.max(1.5,cell*0.09)); g.strokeStyle='#4E7A2A';
  strokePath(g,pts,0,be,bw+3);
  for(let j=0;j<K;j++)strokeSeg(g,pts[be+j],pts[be+j+1],lerp(bw+3,cell*0.22+3,(j+1)/K));
  g.restore();
  g.strokeStyle='#A6D63E';
  for(let j=0;j<K;j++)strokeSeg(g,pts[be+j],pts[be+j+1],lerp(bw,cell*0.2,(j+1)/K));
  strokePath(g,pts,0,be,bw);
  g.save(); g.globalAlpha=(opts.alpha!=null?opts.alpha:1)*0.38;
  g.translate(-cell*0.05,-cell*0.14); g.strokeStyle='#E4FF8F';
  strokePath(g,pts,0,be,cell*0.18); g.restore();
  const h=pts[0];
  let dx,dy;
  if(opts.headDir&&(opts.headDir.x||opts.headDir.y)){dx=opts.headDir.x;dy=opts.headDir.y}
  else if(n>1){const vx=h.x-pts[1].x,vy=h.y-pts[1].y,L=Math.hypot(vx,vy);dx=L>0.001?vx/L:1;dy=L>0.001?vy/L:0}
  else{dx=1;dy=0}
  const hr=bw*0.62;
  g.fillStyle='#4E7A2A'; g.beginPath(); g.arc(h.x,h.y+Math.max(1.5,cell*0.09),hr+1,0,6.2832); g.fill();
  g.fillStyle='#CDEE5B'; g.beginPath(); g.arc(h.x,h.y,hr,0,6.2832); g.fill();
  const pxn=-dy,pyn=dx,er=cell*0.135;
  for(let s=-1;s<=1;s+=2){
    const ex=h.x+dx*hr*0.28+pxn*s*hr*0.55, ey=h.y+dy*hr*0.28+pyn*s*hr*0.55;
    g.fillStyle='#F4F2E6'; g.beginPath(); g.arc(ex,ey,er,0,6.2832); g.fill();
    g.fillStyle='#17240F'; g.beginPath(); g.arc(ex+dx*er*0.4,ey+dy*er*0.4,er*0.52,0,6.2832); g.fill();
  }
  g.restore();
  return {h,dx,dy,hr};
}
function drawTongue(g,h,dx,dy,hr,cell){
  const tx=h.x+dx*(hr+1),ty=h.y+dy*(hr+1),ex=tx+dx*cell*0.34,ey=ty+dy*cell*0.34,u=cell*0.14;
  g.strokeStyle='#FF5348'; g.lineWidth=Math.max(1.5,cell*0.09); g.lineCap='round';
  g.beginPath();
  g.moveTo(tx,ty); g.lineTo(ex,ey);
  g.moveTo(ex,ey); g.lineTo(ex+(dx*0.5-dy*0.5)*u,ey+(dy*0.5+dx*0.5)*u);
  g.moveTo(ex,ey); g.lineTo(ex+(dx*0.5+dy*0.5)*u,ey+(dy*0.5-dx*0.5)*u);
  g.stroke();
}
function drawApple(g,cx,cy,cell,alpha){
  const r=cell*0.32;
  g.save(); if(alpha!=null)g.globalAlpha=alpha;
  g.fillStyle='#B23430'; g.beginPath(); g.arc(cx,cy+2,r,0,6.2832); g.fill();
  g.fillStyle='#FF5348'; g.beginPath(); g.arc(cx,cy,r,0,6.2832); g.fill();
  g.fillStyle='#FF9B8A'; g.beginPath(); g.arc(cx-r*0.32,cy-r*0.34,r*0.3,0,6.2832); g.fill();
  g.strokeStyle='#6B8F3E'; g.lineWidth=Math.max(1.5,cell*0.07); g.lineCap='round';
  g.beginPath(); g.moveTo(cx,cy-r+1); g.lineTo(cx+r*0.18,cy-r-3); g.stroke();
  g.fillStyle='#7CB35A'; g.beginPath(); g.ellipse(cx+r*0.55,cy-r-3,r*0.42,r*0.2,-0.5,0,6.2832); g.fill();
  g.restore();
}
function spawnBurst(arr,cx,cy,cell){
  const colors=['#FF5348','#FFD34D','#CDEF4F','#FF9B8A'];
  for(let i=0;i<10;i++){
    const a=Math.random()*6.2832, sp=cell*(0.05+Math.random()*0.14), L=420+Math.random()*260;
    arr.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:L,max:L,r:cell*(0.06+Math.random()*0.08),c:colors[i&3]});
  }
  if(arr.length>80)arr.splice(0,arr.length-80);
}
function stepParticles(arr,dt){
  for(let i=arr.length-1;i>=0;i--){
    const p=arr[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.life<=0)arr.splice(i,1);
  }
}
function drawParticles(g,arr){
  for(const p of arr){
    g.globalAlpha=Math.max(0,p.life/p.max); g.fillStyle=p.c;
    g.beginPath(); g.arc(p.x,p.y,p.r*(p.life/p.max),0,6.2832); g.fill();
  }
  g.globalAlpha=1;
}

/* ================= state ================= */
let state='home';
const cv=$('#cv'), ctx=cv.getContext('2d'), stage=$('#stage');
let dpr=1,W=0,H=0,cols=15,rows=22,cell=24,boardLayer=null;
const snake=[],prevSnake=[];
let dir={x:1,y:0}; const queue=[];
let food=null;
let score=0,eaten=0,streak=0;
let best=store.get('sc_best',0)|0, apples=store.get('sc_apples',0)|0;
let tickMs=165,acc=0,lastT=0;
const particles=[],floats=[];
let shake=0,deathAt=0,borderFlash=0,tongueUntil=0,nextTongue=0,deathTimer=null,countTimer=null,toastTimer=null;

/* ================= game layout ================= */
function fit(){
  const r=stage.getBoundingClientRect();
  const aw=Math.max(120,r.width-8), ah=Math.max(120,r.height-8);
  cell=clamp(Math.min(aw,ah)/15,12,46);
  cols=clamp(Math.floor(aw/cell),11,30);
  rows=clamp(Math.floor(ah/cell),11,32);
  cell=Math.min(aw/cols,ah/rows);
  W=Math.floor(cell*cols); H=Math.floor(cell*rows);
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.floor(W*dpr)); cv.height=Math.max(1,Math.floor(H*dpr));
  cv.style.width=W+'px'; cv.style.height=H+'px';
  buildBoard();
}
function buildBoard(){
  boardLayer=document.createElement('canvas');
  boardLayer.width=cv.width; boardLayer.height=cv.height;
  const b=boardLayer.getContext('2d'); b.scale(dpr,dpr);
  b.fillStyle='#121B14'; b.fillRect(0,0,W,H);
  b.fillStyle='rgba(255,255,255,0.025)';
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if((x+y)&1)b.fillRect(x*cell,y*cell,cell,cell);
  const glow=b.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.62);
  glow.addColorStop(0,'rgba(205,239,79,0.045)');
  glow.addColorStop(0.5,'rgba(205,239,79,0.012)');
  glow.addColorStop(1,'rgba(205,239,79,0)');
  b.fillStyle=glow; b.fillRect(0,0,W,H);
  const vig=b.createRadialGradient(W/2,H/2,Math.min(W,H)*0.34,W/2,H/2,Math.max(W,H)*0.72);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,0.4)');
  b.fillStyle=vig; b.fillRect(0,0,W,H);
  b.strokeStyle='rgba(237,235,221,0.06)'; b.lineWidth=1.5;
  b.strokeRect(0.75,0.75,W-1.5,H-1.5);
}

/* ================= game flow ================= */
function startGame(){
  clearTimeout(deathTimer); cancelCount();
  $('#overPanel').classList.add('hidden'); $('#pausePanel').classList.add('hidden');
  showScreen('game'); fit();
  const cy0=rows>>1, cx0=Math.max(3,(cols/3)|0);
  snake.length=0; for(let i=0;i<4;i++)snake.push({x:cx0-i,y:cy0});
  prevSnake.length=0; for(const s of snake)prevSnake.push({x:s.x,y:s.y});
  dir={x:1,y:0}; queue.length=0;
  score=0; eaten=0; streak=0; tickMs=165; acc=0; shake=0; borderFlash=0;
  particles.length=0; floats.length=0; food=null;
  spawnFood(); updHUD();
  runCountdown(['3','2','1','GO']);
}
function runCountdown(seq){
  cancelCount(); state='count';
  const el=$('#count'); el.classList.remove('hidden');
  let i=0;
  const step=()=>{
    if(state!=='count')return;
    if(i>=seq.length){el.classList.add('hidden');state='play';acc=0;return}
    const s=seq[i++]; el.textContent=s;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    if(s==='GO'){ Sfx.go(); state='play'; acc=0;
      countTimer=setTimeout(()=>{if(state==='play')el.classList.add('hidden')},340); return; }
    Sfx.click(); countTimer=setTimeout(step,430);
  };
  step();
}
function cancelCount(){clearTimeout(countTimer);$('#count').classList.add('hidden')}
function pauseGame(){if(state!=='play')return;openPause()}
function openPause(){state='pause';$('#count').classList.add('hidden');$('#overPanel').classList.add('hidden');$('#pausePanel').classList.remove('hidden')}
function resumeGame(){if(state!=='pause')return;$('#pausePanel').classList.add('hidden');runCountdown(['GO'])}
function restartGame(){Sfx.click();startGame()}
function goHome(){
  clearTimeout(deathTimer); cancelCount(); state='home';
  $('#pausePanel').classList.add('hidden'); $('#overPanel').classList.add('hidden');
  updateHomeStats(); showScreen('home');
}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id))}

/* ================= core rules ================= */
function tick(){
  while(queue.length){
    const d=queue.shift();
    const rev=(d.x===-dir.x&&d.y===-dir.y), same=(d.x===dir.x&&d.y===dir.y);
    if(!rev&&!same){dir=d;break}
  }
  prevSnake.length=0; for(const s of snake)prevSnake.push({x:s.x,y:s.y});
  const hx=snake[0].x+dir.x, hy=snake[0].y+dir.y;
  if(hx<0||hy<0||hx>=cols||hy>=rows)return die();
  const eat=!!food&&hx===food.x&&hy===food.y;
  const lim=eat?snake.length:snake.length-1;
  for(let i=0;i<lim;i++)if(snake[i].x===hx&&snake[i].y===hy)return die();
  snake.unshift({x:hx,y:hy});
  if(eat)onEat(); else snake.pop();
}
function onEat(){
  score+=10; eaten++; streak++;
  tickMs=Math.max(78,165-2.3*eaten);
  const cx=(food.x+.5)*cell, cy=(food.y+.5)*cell;
  spawnBurst(particles,cx,cy,cell);
  floats.push({x:cx,y:cy,t:700,max:700,text:'+10'});
  Sfx.eat(streak); buzz(12);
  if(score%100===0){toast('Speed up');Sfx.milestone();buzz(20)}
  spawnFood(); updHUD();
}
function die(){
  if(state!=='play')return;
  state='dying'; deathAt=performance.now(); shake=1; borderFlash=600;
  Sfx.die(); buzz([70,50,90]);
  deathTimer=setTimeout(()=>{if(state==='dying')showOver(false)},700);
}
function winGame(){
  state='dying'; deathAt=performance.now(); food=null;
  deathTimer=setTimeout(()=>{if(state==='dying')showOver(true)},600);
}
function spawnFood(){
  const occ=new Set(); for(const s of snake)occ.add(s.x+s.y*cols);
  const free=[];
  for(let i=0;i<cols*rows;i++)if(!occ.has(i))free.push(i);
  if(!free.length)return winGame();
  const i=free[(Math.random()*free.length)|0];
  food={x:i%cols,y:(i/cols)|0,born:performance.now()};
}
function showOver(win){
  state='over';
  const nb=score>best;
  if(nb){best=score;store.set('sc_best',best)}
  apples+=eaten; store.set('sc_apples',apples);
  $('#overTitle').textContent=win?'You win':'Game over';
  $('#finalScore').textContent=score;
  $('#overBest').textContent=best;
  $('#newBest').classList.toggle('hidden',!nb);
  $('#pausePanel').classList.add('hidden');
  $('#overPanel').classList.remove('hidden');
  updHUD();
}

/* ================= input ================= */
function pushDir(d){
  if(state!=='play'&&state!=='count')return;
  if(queue.length>=3)return;
  const last=queue.length?queue[queue.length-1]:dir;
  if((d.x===last.x&&d.y===last.y)||(d.x===-last.x&&d.y===-last.y))return;
  queue.push(d);
}
let tracking=false,pxs=0,pys=0; const TH=22;
stage.addEventListener('pointerdown',e=>{tracking=true;pxs=e.clientX;pys=e.clientY;Sfx.ac();});
stage.addEventListener('pointermove',e=>{
  if(!tracking)return;
  const dx=e.clientX-pxs, dy=e.clientY-pys;
  if(Math.abs(dx)<TH&&Math.abs(dy)<TH)return;
  pushDir(Math.abs(dx)>Math.abs(dy)?{x:dx>0?1:-1,y:0}:{x:0,y:dy>0?1:-1});
  pxs=e.clientX; pys=e.clientY;
});
const endPtr=()=>{tracking=false};
stage.addEventListener('pointerup',endPtr);
stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('contextmenu',e=>e.preventDefault());

const KEY={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
           w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
window.addEventListener('keydown',e=>{
  const d=KEY[e.key];
  if(d&&(state==='play'||state==='count')){e.preventDefault();pushDir(d)}
  else if(e.key===' '||e.key==='p'||e.key==='P'){
    if(state==='play'){e.preventDefault();Sfx.click();pauseGame()}
    else if(state==='pause'){e.preventDefault();Sfx.click();resumeGame()}
  }
  else if(e.key==='Enter'){
    if(state==='over')restartGame();
    else if(state==='home'){Sfx.ac();Sfx.click();startGame()}
  }
});

/* ================= ambient home snake ================= */
const ambCv=$('#ambient'), ambCtx=ambCv.getContext('2d');
const amb={w:0,h:0,cell:24,cols:0,rows:0,snake:[],prev:[],dir:{x:1,y:0},food:null,
           grow:0,acc:0,tickMs:150,particles:[],tongueUntil:0,nextTongue:1500};
function fitAmbient(){
  amb.w=window.innerWidth; amb.h=window.innerHeight;
  const d=Math.min(window.devicePixelRatio||1,2);
  ambCv.width=Math.floor(amb.w*d); ambCv.height=Math.floor(amb.h*d);
  ambCtx.setTransform(d,0,0,d,0,0);
  amb.cell=clamp(Math.min(amb.w,amb.h)/24,15,34);
  amb.cols=Math.max(14,Math.floor(amb.w/amb.cell));
  amb.rows=Math.max(14,Math.floor(amb.h/amb.cell));
  ambInit();
}
function ambInit(){
  const r=1+((Math.random()*(amb.rows-2))|0);
  const c=4+((Math.random()*Math.max(1,amb.cols-18))|0);
  amb.snake=[]; for(let i=0;i<10;i++)amb.snake.push({x:c-i,y:r});
  amb.prev=amb.snake.map(s=>({x:s.x,y:s.y}));
  amb.dir={x:1,y:0}; amb.grow=0; amb.acc=0; amb.food=null; ambSpawnFood();
}
function ambSpawnFood(){
  const occ=new Set(); for(const s of amb.snake)occ.add(s.x+s.y*amb.cols);
  const free=[];
  for(let i=0;i<amb.cols*amb.rows;i++)if(!occ.has(i))free.push(i);
  if(!free.length){ambInit();return}
  const i=free[(Math.random()*free.length)|0];
  amb.food={x:i%amb.cols,y:(i/amb.cols)|0};
}
function ambStep(){
  const head=amb.snake[0];
  const cand=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>!(d.x===-amb.dir.x&&d.y===-amb.dir.y));
  const safe=cand.filter(d=>{
    const nx=head.x+d.x, ny=head.y+d.y;
    if(nx<0||ny<0||nx>=amb.cols||ny>=amb.rows)return false;
    for(let i=0;i<amb.snake.length-1;i++)if(amb.snake[i].x===nx&&amb.snake[i].y===ny)return false;
    return true;
  });
  if(!safe.length){ambInit();return}
  let nd=safe[(Math.random()*safe.length)|0];
  if(amb.food&&Math.random()<0.8){
    let bd=1e9;
    for(const d of safe){
      const dist=Math.abs(head.x+d.x-amb.food.x)+Math.abs(head.y+d.y-amb.food.y);
      if(dist<bd){bd=dist;nd=d}
    }
  }
  amb.dir=nd;
  amb.prev=amb.snake.map(s=>({x:s.x,y:s.y}));
  const hx=head.x+nd.x, hy=head.y+nd.y;
  amb.snake.unshift({x:hx,y:hy});
  if(amb.food&&hx===amb.food.x&&hy===amb.food.y){
    amb.grow+=3;
    spawnBurst(amb.particles,(hx+.5)*amb.cell,(hy+.5)*amb.cell,amb.cell);
    ambSpawnFood();
  }
  if(amb.grow>0&&amb.snake.length<26)amb.grow--; else amb.snake.pop();
}
function renderAmbient(now,dt){
  amb.acc+=dt;
  while(amb.acc>=amb.tickMs){amb.acc-=amb.tickMs;ambStep()}
  ambCtx.clearRect(0,0,amb.w,amb.h);
  stepParticles(amb.particles,dt);
  drawParticles(ambCtx,amb.particles);
  const t=clamp(amb.acc/amb.tickMs,0,1), n=amb.snake.length;
  const pts=new Array(n);
  for(let i=0;i<n;i++){
    const c=amb.snake[i], p=amb.prev[i]||c;
    pts[i]={x:(lerp(p.x,c.x,t)+0.5)*amb.cell,y:(lerp(p.y,c.y,t)+0.5)*amb.cell};
  }
  drawApple(ambCtx,(amb.food.x+.5)*amb.cell,(amb.food.y+.5)*amb.cell,amb.cell,0.55);
  if(now>amb.nextTongue){amb.tongueUntil=now+280;amb.nextTongue=now+1800+Math.random()*2600}
  const res=renderSnakeBody(ambCtx,pts,amb.cell,{alpha:0.5,headDir:amb.dir});
  if(res&&now<amb.tongueUntil)drawTongue(ambCtx,res.h,res.dx,res.dy,res.hr,amb.cell);
}

/* ================= game render ================= */
function render(now,dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0B100C'; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0){
    shake=Math.max(0,shake-dt/320);
    const m=shake*shake*7;
    ctx.translate((Math.random()*2-1)*m,(Math.random()*2-1)*m);
  }
  if(boardLayer)ctx.drawImage(boardLayer,0,0,W,H);
  if(food){
    const cx=(food.x+.5)*cell, cy=(food.y+.5)*cell, age=now-food.born;
    if(age<320){
      const p=age/320;
      ctx.strokeStyle='rgba(255,138,126,'+(0.7*(1-p)).toFixed(3)+')';
      ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,cell*(0.3+0.55*p),0,6.2832); ctx.stroke();
    }
    drawApple(ctx,cx,cy,cell*(1+0.07*Math.sin(now/230)),null);
  }
  const n=snake.length;
  if(n){
    const t=(state==='play')?clamp(acc/tickMs,0,1):1;
    const pts=new Array(n);
    for(let i=0;i<n;i++){
      const c=snake[i], p=prevSnake[i]||prevSnake[prevSnake.length-1]||c;
      pts[i]={x:(lerp(p.x,c.x,t)+0.5)*cell,y:(lerp(p.y,c.y,t)+0.5)*cell};
    }
    if(state==='play'&&now>nextTongue){tongueUntil=now+300;nextTongue=now+1700+Math.random()*2400}
    const res=renderSnakeBody(ctx,pts,cell,{headDir:dir});
    if(res&&state==='play'&&now<tongueUntil)drawTongue(ctx,res.h,res.dx,res.dy,res.hr,cell);
    if((state==='dying'||state==='over')&&Math.floor((now-deathAt)/150)%2===0){
      ctx.strokeStyle='rgba(255,83,72,0.8)'; ctx.lineWidth=cell*0.36; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<n;i++)ctx.lineTo(pts[i].x,pts[i].y);
      ctx.stroke();
    }
  }
  stepParticles(particles,dt); drawParticles(ctx,particles);
  for(let i=floats.length-1;i>=0;i--){floats[i].t-=dt;if(floats[i].t<=0)floats.splice(i,1)}
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='800 '+Math.max(12,Math.floor(cell*0.5))+'px '+MONO;
  for(const f of floats){
    const a=f.t/f.max;
    ctx.globalAlpha=a; ctx.fillStyle='#EDEBDD';
    ctx.fillText(f.text,f.x,f.y-(1-a)*cell*1.1);
  }
  ctx.globalAlpha=1;
  if(borderFlash>0){
    borderFlash-=dt;
    ctx.strokeStyle='rgba(255,83,72,'+Math.max(0,borderFlash/600).toFixed(3)+')';
    ctx.lineWidth=4; ctx.strokeRect(2,2,W-4,H-4);
  }
  ctx.restore();
}

/* ================= main loop ================= */
function frame(now){
  requestAnimationFrame(frame);
  let dt=now-lastT; lastT=now;
  if(dt>200)dt=200; if(dt<0)dt=0;
  if(state==='home'){renderAmbient(now,dt);return}
  if(state==='play'){
    acc+=dt; let g=0;
    while(acc>=tickMs&&state==='play'&&g++<6){acc-=tickMs;tick()}
  }
  render(now,dt);
}

/* ================= UI helpers ================= */
function updHUD(){
  $('#score').textContent=score;
  $('#best').textContent=Math.max(best,score);
}
function updateHomeStats(){
  $('#homeBest').textContent=best;
  $('#homeApples').textContent=apples;
}
function toast(msg){
  const el=$('#toast'); el.textContent=msg;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1100);
}
function toggleMute(){
  Sfx.muted=!Sfx.muted; store.set('sc_muted',Sfx.muted);
  document.body.classList.toggle('muted',Sfx.muted);
  if(!Sfx.muted)Sfx.click();
}

/* ================= wiring ================= */
const on=(id,fn)=>$(id).addEventListener('click',e=>{e.stopPropagation();fn()});
 $('#home').addEventListener('click',()=>{Sfx.ac();Sfx.click();startGame()});
on('#playBtn',()=>{Sfx.ac();Sfx.click();startGame()});
on('#pauseBtn',()=>{Sfx.click();pauseGame()});
on('#resumeBtn',()=>{Sfx.click();resumeGame()});
on('#pRestartBtn',restartGame);
on('#pHomeBtn',goHome);
on('#againBtn',restartGame);
on('#oHomeBtn',goHome);
on('#pauseSound',toggleMute);

let resizeTimer=null;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(onResize,120)});
function onResize(){
  if(state==='home'){fitAmbient();return}
  const oldSnake=snake.map(s=>({x:s.x,y:s.y})), oc=cols, orw=rows;
  if(state==='play'||state==='count'){cancelCount();openPause()}
  fit();
  if(oldSnake.length){
    const sx=cols/oc, sy=rows/orw;
    snake.length=0;
    for(const s of oldSnake)snake.push({x:clamp(Math.round(s.x*sx),0,cols-1),y:clamp(Math.round(s.y*sy),0,rows-1)});
    prevSnake.length=0; for(const s of snake)prevSnake.push({x:s.x,y:s.y});
    if(food){
      food.x=clamp(Math.round(food.x*sx),0,cols-1);
      food.y=clamp(Math.round(food.y*sy),0,rows-1);
      food.born=performance.now();
      if(snake.some(s=>s.x===food.x&&s.y===food.y))spawnFood();
    }
  }
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame()});

/* ================= init ================= */
document.body.classList.toggle('muted',Sfx.muted);
updateHomeStats();
fit();
fitAmbient();
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(frame)});
})();
</script>
